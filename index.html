<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mes Finances</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finances">
<meta name="theme-color" content="#EDF0F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1220" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column phone app, max 560px, fixed bottom tab bar with a central "+" */
:root{
  --bg:#EDF0F6; --surface:#FFFFFF; --surface-2:#E2E7F1; --ink:#131A2C; --muted:#5B6580; --line:#D4DBE8;
  --accent:#2A47C2; --accent-ink:#FFFFFF; --accent-soft:#DCE3FA;
  --income:#16784C; --expense:#BF3F2B; --warn:#A86E12;
  --display:'Bricolage Grotesque', ui-sans-serif, system-ui, sans-serif;
  --body:'Figtree', ui-sans-serif, system-ui, -apple-system, sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1220; --surface:#161D2F; --surface-2:#20293F; --ink:#E7EBF5; --muted:#97A1BA; --line:#2A3450;
  --accent:#8198F4; --accent-ink:#0D1220; --accent-soft:#232D55;
  --income:#4CC48A; --expense:#F0806A; --warn:#E4B24E; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1220; --surface:#161D2F; --surface-2:#20293F; --ink:#E7EBF5; --muted:#97A1BA; --line:#2A3450;
  --accent:#8198F4; --accent-ink:#0D1220; --accent-soft:#232D55;
  --income:#4CC48A; --expense:#F0806A; --warn:#E4B24E; color-scheme:dark }

*{box-sizing:border-box}
html{color-scheme:light;background:var(--bg)}
html,body{margin:0;min-height:100%}
[hidden]{display:none!important}
input,select,textarea{font-size:16px}
body{padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
.auth{max-width:420px;margin:8vh auto 0;display:flex;flex-direction:column;gap:14px}
.auth .logo{width:64px;height:64px;border-radius:18px}
.ok{color:var(--income);font-size:13.5px;font-weight:600}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
.app{max-width:560px;margin:0 auto;padding-block:12px calc(96px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:999px;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--surface-2)}
.month span{font-weight:600;font-size:14px;min-width:110px;text-align:center;text-transform:capitalize}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{background:var(--accent);color:var(--accent-ink);border:0;display:flex;flex-direction:column;gap:14px}
.hero .label{color:inherit;opacity:.8}
.hero .big{font-family:var(--display);font-size:34px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .trio{border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{background:none;border:0;color:var(--accent);font-weight:600;padding:0;font-size:14px}

.bars{display:flex;flex-direction:column;gap:12px}
.bar-row{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.bar-row .name{display:flex;align-items:center;gap:8px;min-width:0}
.bar-row .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:3px;flex:none}
.track{grid-column:1/-1;height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.track i{display:block;height:100%;border-radius:99px}

.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:13px;font-weight:600;
  background:color-mix(in srgb,var(--warn) 14%,transparent);color:var(--warn)}
.pill.over{background:color-mix(in srgb,var(--expense) 14%,transparent);color:var(--expense)}

.list{display:flex;flex-direction:column}
.tx{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:10px 0;border:0;background:none;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.list .tx:last-child{border-bottom:0}
.ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:13px;font-family:var(--display)}
.tx .t{min-width:0}
.tx .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx .t small{color:var(--muted);font-size:12.5px}
.amt{font-weight:700;white-space:nowrap}
.pos{color:var(--income)} .neg{color:var(--expense)}
.day{padding-top:10px}
.day:first-child{padding-top:0}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters input{grid-column:1/-1}
.field{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
textarea.field{resize:vertical;min-height:60px}

.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:8px;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink);min-height:46px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:none;color:var(--expense);border:1px solid color-mix(in srgb,var(--expense) 40%,transparent)}
.btn.danger.sure{background:var(--expense);color:#fff;border-color:transparent}

.acc{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border:0;border-bottom:1px solid var(--line);background:none;width:100%;text-align:left}
.list .acc:last-child{border-bottom:0}

.hero .quad{border-top:1px solid color-mix(in srgb,var(--accent-ink) 25%,transparent);padding-top:12px}
.quad{display:grid;grid-template-columns:repeat(4,1fr);gap:10px 8px}
.quad div{display:flex;flex-direction:column;gap:2px;min-width:0}
.quad b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:420px){.quad{grid-template-columns:1fr 1fr}}
.seg.four{grid-template-columns:repeat(4,1fr)}
.seg.four button{font-size:13px;padding:9px 2px}
.sheet.still{animation:none}
.rec{display:grid;grid-template-columns:36px 1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.list .rec:last-child{border-bottom:0}
.rec .t{min-width:0}.rec .t div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rec .t small{color:var(--muted);font-size:12.5px}
.rec-actions{grid-column:2/-1;display:flex;gap:8px;justify-content:flex-end}
.btn.small{min-height:36px;padding:7px 14px;font-size:14px;border-radius:10px}
.sav{color:var(--accent)}
.acc.goal{row-gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:34px;height:34px;border-radius:999px;border:3px solid transparent;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 2px var(--bg)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--accent)}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .plus{width:52px;height:52px;margin:0 auto;border-radius:18px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;padding:0;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 35%,transparent)}
nav.tabs .plus svg{width:26px;height:26px}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(8,12,24,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:22px 22px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:999px;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface-2);border-radius:12px;padding:3px;gap:3px}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg button{border:0;background:none;border-radius:9px;padding:9px 4px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.amount-in{display:flex;align-items:baseline;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.amount-in input{border:0;background:none;outline:none;font-family:var(--display);font-size:34px;font-weight:700;width:100%;min-width:0}
.amount-in span{font-weight:700;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:6px}
.actions{display:flex;gap:8px}
.actions .btn{flex:1}
.err{color:var(--expense);font-size:13.5px;font-weight:600}
.banner{background:var(--surface-2);border-radius:12px;padding:12px;font-size:14px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px}
</style>
</head>
<body>

<div class="app" id="app"></div>

<nav class="tabs" id="tabs" aria-label="Navigation" hidden>
  <div class="in">
    <button data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</button>
    <button data-tab="ops"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Opérations</button>
    <button class="plus" data-action="new-tx" aria-label="Ajouter une opération"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
    <button data-tab="budgets"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6.5 6"/></svg>Budgets</button>
    <button data-tab="accounts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Comptes</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
/* ---------- catégories ---------- */
const DEFAULT_CATS = {
  expense: [
    ['alim','Alimentation','#2F9E6B'],['logement','Logement','#3F63D9'],['transport','Transport','#D98A1F'],
    ['factures','Factures','#7B5BD6'],['resto','Restos & cafés','#D9534A'],['shopping','Shopping','#C2509A'],
    ['sante','Santé','#1F9DB3'],['loisirs','Loisirs','#8EA52A'],['education','Éducation','#5578A8'],
    ['dime','Dîme','#8A5CC2'],['offrandes','Offrandes','#C27A2E'],
    ['famille','Famille & dons','#B5763C'],['voyage','Voyages','#2BA39A'],['autre','Autres dépenses','#808A9E']
  ],
  income: [
    ['salaire','Salaire','#16784C'],['prime','Prime','#2F9E6B'],['freelance','Freelance','#3F63D9'],
    ['remb','Remboursement','#1F9DB3'],['autre_rev','Autres revenus','#808A9E']
  ]
};
const PALETTE=['#2F9E6B','#3F63D9','#D98A1F','#7B5BD6','#D9534A','#C2509A','#1F9DB3','#8EA52A','#5578A8','#8A5CC2','#C27A2E','#B5763C','#2BA39A','#808A9E'];
let CAT={}, CATS={expense:[],income:[]};
function rebuildCats(){
  const rows={};(S.catRows||[]).forEach(r=>rows[r.key]=r);
  CAT={};CATS={expense:[],income:[]};
  for(const t of ['expense','income']){
    DEFAULT_CATS[t].forEach(([k,n,c],i)=>{const r=rows[k];CAT[k]={key:k,type:t,name:r?.name||n,color:r?.color||c,hidden:!!r?.hidden,sort:r?.sort??i,builtin:true}});
  }
  for(const r of S.catRows||[]) if(!CAT[r.key]) CAT[r.key]={key:r.key,type:r.type,name:r.name,color:r.color||'#808A9E',hidden:!!r.hidden,sort:r.sort??100,builtin:false};
  for(const c of Object.values(CAT)) CATS[c.type].push(c);
  for(const t in CATS) CATS[t].sort((a,b)=>a.sort-b.sort);
}
function visCats(t){return CATS[t].filter(c=>!c.hidden)}
const KINDS = {courant:'Compte courant', especes:'Espèces', epargne:'Épargne', carte:'Carte', autre:'Autre'};

const S = {
  status:'loading', sb:null, user:null, authMode:'login', authMsg:'', authErr:'', authBusy:false, schemaOld:false,
  accounts:[], tx:[], budgets:{}, goals:[], recs:[], catRows:[],
  tab:'home', month: ym(new Date()), filter:{acc:'',cat:'',q:''}, sheet:null
};
rebuildCats();

/* ---------- helpers ---------- */
function pad(n){return String(n).padStart(2,'0')}
function ym(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)}
function today(){const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function shiftMonth(m,delta){const [y,mo]=m.split('-').map(Number);const d=new Date(y,mo-1+delta,1);return ym(d)}
function daysIn(m){const [y,mo]=m.split('-').map(Number);return new Date(y,mo,0).getDate()}
const fmtMonth = new Intl.DateTimeFormat('fr-FR',{month:'long',year:'numeric'});
const fmtShortMonth = new Intl.DateTimeFormat('fr-FR',{month:'short'});
const fmtDay = new Intl.DateTimeFormat('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const fmtShortDay=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'short'});
const fmtLongDate=new Intl.DateTimeFormat('fr-FR',{day:'numeric',month:'long',year:'numeric'});
function monthLabel(m){const [y,mo]=m.split('-').map(Number);return fmtMonth.format(new Date(y,mo-1,1))}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function toDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function dayLabel(s){if(s===today())return "Aujourd'hui";const yd=new Date();yd.setDate(yd.getDate()-1);if(s===ymd(yd))return 'Hier';return fmtDay.format(toDate(s))}
function shortDate(s){return fmtShortDay.format(toDate(s))}
const nf = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});
function mad(n,sign){const s=nf.format(Math.abs(n))+' DH';if(sign&&n>0)return '+'+s;if(n<0)return '−'+s;return s}
function madShort(n){return (n<0?'−':'')+nf0.format(Math.abs(n))+' DH'}
function amtStr(n){return nf.format(n).replace(/[\s  ]/g,'')}
function parseAmt(s){const v=parseFloat(String(s).replace(/[\s  ]/g,'').replace(',','.'));return isFinite(v)?Math.round(v*100)/100:NaN}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function accName(id){const a=S.accounts.find(x=>x.id===id);return a?a.name:'Compte supprimé'}
function goalOf(id){return S.goals.find(g=>g.id===id)}
function initials(s){return (s||'?').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()}
function catOf(k){return CAT[k]||{key:k,name:k||'Sans catégorie',color:'#808A9E'}}
function isSav(t){return t.type==='saving'||t.type==='unsaving'}

/* ---------- calculs ---------- */
function balances(){
  const b={}; for(const a of S.accounts) b[a.id]=Number(a.initial)||0;
  for(const t of S.tx){
    const v=Number(t.amount)||0, a=t.account in b;
    if(t.type==='income'&&a) b[t.account]+=v;
    else if((t.type==='expense'||t.type==='saving')&&a) b[t.account]-=v;
    else if(t.type==='unsaving'&&a) b[t.account]+=v;
    else if(t.type==='transfer'){ if(a) b[t.account]-=v; if(t.toAccount in b) b[t.toAccount]+=v; }
  }
  return b;
}
function goalSaved(id){let s=0;for(const t of S.tx){if(t.goal!==id)continue;if(t.type==='saving')s+=t.amount;else if(t.type==='unsaving')s-=t.amount}return s}
function totalSaved(){return S.goals.reduce((a,g)=>a+goalSaved(g.id),0)}
function bmOf(t){return t.bm||(t.date||'').slice(0,7)}
function monthTx(m){return S.tx.filter(t=>bmOf(t)===m)}
const AUTO_DAY=25; // revenu reçu à partir de ce jour : compté pour le mois suivant
function autoBm(d){const m=(d.date||today()).slice(0,7);if(d.type==='income'&&Number((d.date||'').slice(8,10))>=AUTO_DAY)return shiftMonth(m,1);return m}
function monthStats(m){
  let inc=0,exp=0,sav=0; const byCat={};
  for(const t of monthTx(m)){
    const v=Number(t.amount)||0;
    if(t.type==='income') inc+=v;
    else if(t.type==='expense'){exp+=v; byCat[t.cat]=(byCat[t.cat]||0)+v;}
    else if(t.type==='saving') sav+=v; else if(t.type==='unsaving') sav-=v;
  }
  return {inc,exp,sav,net:inc-exp-sav,byCat};
}
function goalPlan(g){
  const saved=goalSaved(g.id);const left=g.target?Math.max(0,g.target-saved):0;
  let perMonth=null,monthsLeft=null;
  if(g.target&&g.deadline&&left>0){const now=new Date();const d=toDate(g.deadline);
    monthsLeft=(d.getFullYear()-now.getFullYear())*12+(d.getMonth()-now.getMonth())+1;perMonth=monthsLeft>0?left/monthsLeft:left}
  return {saved,left,perMonth,monthsLeft,pct:g.target?Math.min(1,saved/g.target):null};
}
/* récurrentes en attente : chaque mois depuis le début (ou le dernier traité) jusqu'à aujourd'hui */
function pendingRecs(){
  const out=[];const now=ym(new Date()),td=today();
  for(const r of S.recs){ if(!r.active) continue;
    let m=r.lastMonth?shiftMonth(r.lastMonth,1):r.startMonth;let n=0;
    while(m<=now&&n<12){const date=m+'-'+pad(Math.min(r.day,daysIn(m)));if(date<=td)out.push({rec:r,month:m,date});m=shiftMonth(m,1);n++}
  }
  return out.sort((a,b)=>a.date.localeCompare(b.date));
}
function nextDue(r){const now=ym(new Date());let m=r.lastMonth?shiftMonth(r.lastMonth,1):r.startMonth;if(m<now)m=now;
  for(let i=0;i<14;i++){const d=m+'-'+pad(Math.min(r.day,daysIn(m)));if(!(r.lastMonth&&m<=r.lastMonth))return d;m=shiftMonth(m,1)}return null}

  let h='';

}
function txSort(a,b){return (b.date||'').localeCompare(a.date||'')||((b.createdAt||0)-(a.createdAt||0))}

function chart6(){
  const months=[];for(let i=5;i>=0;i--)months.push(shiftMonth(S.month,-i));
  const data=months.map(m=>{const s=monthStats(m);return {m,inc:s.inc,exp:s.exp}});
  const max=Math.max(100,...data.map(d=>Math.max(d.inc,d.exp)));
  const step=niceStep(max); const top=Math.ceil(max/step)*step;
  const W=340,H=170,L=44,B=24,T=8,R=4; const cw=(W-L-R)/6; const bw=Math.min(16,cw/3.2);
  const y=v=>T+(H-T-B)*(1-v/top);
  let g='';
  for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${kfmt(v)}</text>`}
  data.forEach((d,i)=>{const cx=L+cw*i+cw/2;
    g+=`<rect x="${cx-bw-1}" y="${y(d.inc)}" width="${bw}" height="${Math.max(0,y(0)-y(d.inc))}" rx="3" fill="var(--income)"/>`;
    g+=`<rect x="${cx+1}" y="${y(d.exp)}" width="${bw}" height="${Math.max(0,y(0)-y(d.exp))}" rx="3" fill="var(--expense)"/>`;
    const [yy,mm]=d.m.split('-').map(Number);
    g+=`<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="${d.m===S.month?'var(--ink)':'var(--muted)'}" font-weight="${d.m===S.month?700:400}">${fmtShortMonth.format(new Date(yy,mm-1,1)).replace('.','')}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Revenus et dépenses des 6 derniers mois">${g}</svg>`;
}
function niceStep(max){const raw=max/4;const p=Math.pow(10,Math.floor(Math.log10(raw)));for(const m of [1,2,2.5,5,10]) if(raw<=m*p) return m*p;return 10*p}
function kfmt(v){return v>=1000?nf0.format(v/1000)+' k':nf0.format(v)}

function txRow(t){

function opsList(){

    if(f.acc&&t.account!==f.acc&&t.toAccount!==f.acc) return false;

function errLine(s){return s.err?`<div class="err">${esc(s.err)}</div>`:''}

  if(d.type==='saving'){
    h+=`<div class="seg two">${[['in','Mettre de côté'],['out','Retirer']].map(([k,n])=>`<button type="button" data-dir="${k}" aria-pressed="${d.dir===k}">${n}</button>`).join('')}</div>`;
  }
  h+=amountField('s-amount',d.amountStr,true);
  if(d.type==='expense'||d.type==='income') h+=`<div class="f"><span class="label">Catégorie</span>${catChips(d.type,d.cat)}</div>`;
  if(d.type==='saving'){
    h+=`<div class="f"><span class="label">Objectif</span>`;
    h+=S.goals.length?`<div class="chips">${S.goals.map(g=>`<button type="button" class="chip" data-goal="${g.id}" aria-pressed="${d.goal===g.id}"><i class="dot" style="background:${g.color||'#2A47C2'}"></i>${esc(g.name)}</button>`).join('')}</div>`
      :`<p class="muted" style="margin:0">Aucun objectif. <button type="button" class="link" data-action="new-goal">Crée ton premier objectif</button></p>`;

  else h+=`<label class="f"><span class="label">${d.type==='saving'?(d.dir==='in'?'Depuis le compte':'Vers le compte'):'Compte'}</span><select id="s-acc" class="field">${accOptions(d.account)}</select></label>`;
  h+=`<div class="row2"><label class="f"><span class="label">Date</span><input id="s-date" type="date" class="field" value="${esc(d.date)}"></label><label class="f"><span class="label">Note</span><input id="s-note" class="field" placeholder="${d.type==='saving'?'Facultatif':'Ex. Marjane'}" value="${esc(d.note)}"></label></div>`;
  if(d.type!=='transfer'){const dm=d.date.slice(0,7);const opts=[-1,0,1].map(k=>shiftMonth(dm,k));if(!opts.includes(d.bm))opts.push(d.bm);
    const auto=!d.bmManual&&d.bm!==dm;
    h+=`<label class="f"><span class="label">Compté dans le mois de</span><select id="s-bm" class="field">${opts.map(m=>`<option value="${m}" ${m===d.bm?'selected':''}>${monthLabel(m)}${m===dm?' (mois de la date)':''}</option>`).join('')}</select>${auto?`<small class="muted">Reçu à partir du ${AUTO_DAY} : compté automatiquement en ${monthLabel(d.bm)}. Tu peux changer.</small>`:''}</label>`;}
  if(s.rec) h+=`<small class="muted">Ajuste le montant si besoin (ex. facture d'électricité), puis valide.</small>`;
  h+=errLine(s);
  h+=`<div class="actions">${delBtn(s,'del-tx')}<button type="submit" class="btn" ${s.busy?'disabled':''}>${s.busy?'Enregistrement…':(s.rec?'Valider':'Enregistrer')}</button></div>`;

}

/* ---------- écritures ---------- */
async function guard(fn){
  if(!S.sb||!S.user){toast('Connecte-toi pour enregistrer.');return false}
  try{await fn();await loadAll();return true}catch(e){
    console.error(e);
    const m=e?.message||'';
    const msg=/fetch|network/i.test(m)?"Pas de connexion internet. Réessaie dans un instant."
      :/does not exist|schema cache|transactions_type_check/i.test(m)?"La base n'est pas à jour : lance le script migration-v4.sql dans Supabase."
      :/foreign key|violates/i.test(m)?"Impossible : cet élément est encore utilisé par des opérations."
      :"L'enregistrement a échoué ("+(m||'erreur inconnue')+").";
    if(S.sheet){S.sheet.err=msg;S.sheet.busy=false;renderSheet()}else toast(msg);return false}
}
function toast(m){const r=document.getElementById('toast-root');r.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>r.innerHTML='',2400)}

async function saveTx(){
  readTxForm();const s=S.sheet,d=s.data;const amount=parseAmt(d.amountStr);
  if(!(amount>0)){s.err='Saisis un montant supérieur à 0.';return renderSheet()}
  if(!d.account){s.err='Choisis un compte.';return renderSheet()}
  if(d.type==='transfer'&&d.account===d.toAccount){s.err='Choisis deux comptes différents.';return renderSheet()}
  if(d.type==='saving'&&!d.goal){s.err='Choisis un objectif d\'épargne.';return renderSheet()}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.date)){s.err='Choisis une date.';return renderSheet()}
  const type=d.type==='saving'?(d.dir==='out'?'unsaving':'saving'):d.type;
  if(type==='unsaving'){const avail=goalSaved(d.goal)+(s.id&&s.orig?.type==='unsaving'&&s.orig.goal===d.goal?s.orig.amount:0)-(s.id&&s.orig?.type==='saving'&&s.orig.goal===d.goal?s.orig.amount:0);
    if(amount>avail+0.001){s.err=`Tu ne peux pas retirer plus que l'épargne de cet objectif (${mad(avail)}).`;return renderSheet()}}
  const bm=d.type!=='transfer'&&d.bm&&d.bm!==d.date.slice(0,7)?d.bm:null;
  const row={type,amount,account_id:d.account,to_account_id:d.type==='transfer'?d.toAccount:null,category:(d.type==='expense'||d.type==='income')?d.cat:null,
    goal_id:d.type==='saving'?d.goal:null,date:d.date,note:(d.note||'').trim().slice(0,120)||null,budget_month:bm};
  if(s.rec) row.recurring_id=s.rec.id;
  s.busy=true;renderSheet();
  const ok=await guard(async()=>{
    await q(s.id?S.sb.from('transactions').update(row).eq('id',s.id):S.sb.from('transactions').insert({...row,user_id:S.user.id}));
    if(s.rec&&(!s.rec.lastMonth||s.recMonth>s.rec.lastMonth)) await q(S.sb.from('recurring').update({last_month:s.recMonth}).eq('id',s.rec.id));
  });
  if(ok){closeSheet();toast(s.rec?'Opération validée':s.id?'Opération modifiée':'Opération enregistrée');const tm=bm||d.date.slice(0,7);if(tm!==S.month&&S.tab!=='accounts'){S.month=tm;render()}}
}
async function saveAcc(){
  const s=S.sheet,$=id=>document.getElementById(id);
  const name=$('a-name').value.trim(),kind=$('a-kind').value,istr=$('a-initial').value.trim();
  s.data={name,kind,initialStr:istr};
  const initial=istr===''?0:parseAmt(istr.replace(/^[−-]/,'-'));
  if(!name){s.err='Donne un nom au compte.';return renderSheet()}
  if(!isFinite(initial)){s.err='Le solde de départ doit être un nombre.';return renderSheet()}
  const order=s.id?(S.accounts.find(a=>a.id===s.id)?.order??0):(Math.max(0,...S.accounts.map(a=>a.order||0))+1);
  const ok=await guard(()=>q(s.id?S.sb.from('accounts').update({name,kind,initial,sort:order}).eq('id',s.id):S.sb.from('accounts').insert({name,kind,initial,sort:order,user_id:S.user.id})));
  if(ok){closeSheet();toast(s.id?'Compte modifié':'Compte ajouté')}
}
async function saveBudget(){
  const s=S.sheet,str=document.getElementById('b-limit').value.trim();const v=str===''?0:parseAmt(str);
  if(!isFinite(v)||v<0){s.err='Saisis un montant positif.';return renderSheet()}
  const ok=await guard(()=>q(v>0?S.sb.from('budgets').upsert({user_id:S.user.id,category:s.id,monthly_limit:v}):S.sb.from('budgets').delete().eq('category',s.id)));
  if(ok){closeSheet();toast(v>0?'Budget enregistré':'Limite retirée')}
}
async function saveGoal(){
  readGoalForm();const s=S.sheet,d=s.data;const name=(d.name||'').trim();
  const target=(d.targetStr||'').trim()===''?null:parseAmt(d.targetStr);
  if(!name){s.err='Donne un nom à ton objectif.';return renderSheet()}
  if(target!==null&&!(target>0)){s.err='Le montant cible doit être supérieur à 0, ou laisse-le vide.';return renderSheet()}
  const row={name,target,deadline:d.deadline||null,color:d.color||PALETTE[1]};
  const fromTx=s.back;
  const ok=await guard(async()=>{
    if(s.id) await q(S.sb.from('goals').update(row).eq('id',s.id));
    else{const ins=await q(S.sb.from('goals').insert({...row,sort:S.goals.length+1,user_id:S.user.id}).select());if(fromTx&&ins?.[0])fromTx.data.goal=ins[0].id}
  });
  if(ok){if(fromTx){S.sheet=fromTx;fromTx.err='';renderSheet()}else closeSheet();toast(s.id?'Objectif modifié':'Objectif créé')}
}
async function saveRec(){
  readRecForm();const s=S.sheet,d=s.data;const amount=parseAmt(d.amountStr);const day=parseInt(d.day,10);
  if(!(d.note||'').trim()){s.err='Donne un nom (ex. Loyer).';return renderSheet()}
  if(!(amount>0)){s.err='Saisis un montant supérieur à 0.';return renderSheet()}
  if(!(day>=1&&day<=31)){s.err='Le jour doit être entre 1 et 31.';return renderSheet()}
  if(!d.account){s.err='Choisis un compte.';return renderSheet()}
  const row={type:d.type,amount,category:d.cat,account_id:d.account,day,note:d.note.trim().slice(0,80),start_month:d.start,active:d.active!==false};
  if(s.id&&s.orig&&s.orig.startMonth!==d.start) row.last_month=null;
  const ok=await guard(()=>q(s.id?S.sb.from('recurring').update(row).eq('id',s.id):S.sb.from('recurring').insert({...row,user_id:S.user.id})));
  if(ok){closeSheet();toast(s.id?'Récurrente modifiée':'Récurrente ajoutée')}
}

async function exportCsv(){
  const cols=['Date','Mois budgétaire','Type','Catégorie / Objectif','Compte','Vers le compte','Montant (DH)','Note'];
  const TL={expense:'Dépense',income:'Revenu',transfer:'Virement',saving:'Épargne (mis de côté)',unsaving:'Épargne (retrait)'};
  const cell=v=>{v=String(v??'');return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  const rows=[...S.tx].sort((a,b)=>(a.date||'').localeCompare(b.date||'')).map(t=>{
    const sign=t.type==='expense'||t.type==='saving'?-1:t.type==='transfer'?1:1;
    return [t.date,bmOf(t),TL[t.type]||t.type,isSav(t)?(goalOf(t.goal)?.name||''):t.type==='transfer'?'':catOf(t.cat).name,accName(t.account),t.type==='transfer'?accName(t.toAccount):'',
      (sign*t.amount).toFixed(2).replace('.',','),t.note||''].map(cell).join(';')});
  const csv='﻿'+[cols.join(';'),...rows].join('\r\n');
  const name='mes-finances-'+today()+'.csv';
  const file=new File([csv],name,{type:'text/csv'});
  try{ if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return} }catch(e){if(e?.name==='AbortError')return}
  const url=URL.createObjectURL(file);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);
  toast(S.tx.length+' opérations exportées');
}

/* ---------- événements ---------- */
async function del(table,id,msg){if(await guard(()=>q(S.sb.from(table).delete().eq('id',id)))){closeSheet();toast(msg)}}
function confirmOr(s){if(!s.confirmDel){readAny();s.confirmDel=true;renderSheet();return false}return true}
document.addEventListener('click',async e=>{
  const t=e.target.closest('button,[data-scrim]');if(!t)return;
  if(t.matches('[data-scrim]')){if(e.target===t)closeSheet();return}
  const ds=t.dataset, sh=S.sheet;
  if(ds.tab){S.tab=ds.tab;render();scrollTo(0,0);return}
  if(ds.tabGo){S.tab=ds.tabGo;render();scrollTo(0,0);return}
  if(ds.editTx){const x=S.tx.find(v=>v.id===ds.editTx);if(!x)return;
    openSheet({kind:'tx',id:x.id,orig:x,data:{type:isSav(x)?'saving':x.type,dir:x.type==='unsaving'?'out':'in',amountStr:amtStr(x.amount),cat:x.cat||(x.type==='income'?'salaire':'alim'),goal:x.goal||S.goals[0]?.id||null,account:x.account,toAccount:x.toAccount||x.account,date:x.date,note:x.note||'',bm:bmOf(x),bmManual:true}});return}
  if(ds.editAcc){const a=S.accounts.find(v=>v.id===ds.editAcc);if(!a)return;
    openSheet({kind:'acc',id:a.id,data:{name:a.name,kind:a.kind||'courant',initialStr:a.initial?amtStr(a.initial):''}});return}
  if(ds.editGoal){const g=goalOf(ds.editGoal);if(!g)return;openSheet({kind:'goal',id:g.id,data:{name:g.name,targetStr:g.target?amtStr(g.target):'',deadline:g.deadline||'',color:g.color||PALETTE[1]}});return}
  if(ds.editRec){const r=S.recs.find(v=>v.id===ds.editRec);if(!r)return;
    openSheet({kind:'rec',id:r.id,orig:r,data:{type:r.type,note:r.note||'',amountStr:amtStr(r.amount),cat:r.cat,account:r.account,day:r.day,start:r.startMonth,active:r.active}});return}
  if(ds.editCat){const c=CAT[ds.editCat];if(!c)return;openSheet({kind:'cat',id:c.key,data:{name:c.name,color:c.color,hidden:c.hidden,type:c.type}});return}
  if(ds.budget){const k=ds.budget;openSheet({kind:'budget',id:k,data:{limitStr:S.budgets[k]?amtStr(S.budgets[k]):''}});return}
  if(ds.doRec){const r=S.recs.find(v=>v.id===ds.doRec);if(!r)return;
    const data={type:r.type,dir:'in',amountStr:amtStr(r.amount),cat:r.cat,goal:null,account:r.account,toAccount:r.account,date:ds.date,note:r.note||'',bmManual:false};
    data.bm=autoBm(data);openSheet({kind:'tx',rec:r,recMonth:ds.month,data});return}
  if(ds.skipRec){const r=S.recs.find(v=>v.id===ds.skipRec);if(!r)return;
    if(await guard(()=>q(S.sb.from('recurring').update({last_month:ds.month}).eq('id',r.id))))toast('Ignorée pour '+monthLabel(ds.month));return}
  if(sh){
    if(ds.type&&sh.kind==='tx'){readTxForm();const d=sh.data;d.type=ds.type;
      if((d.type==='expense'||d.type==='income')&&!(CAT[d.cat]?.type===d.type))d.cat=visCats(d.type)[0]?.key;
      if(!d.bmManual)d.bm=autoBm(d);sh.err='';renderSheet();return}
    if(ds.dir){readTxForm();sh.data.dir=ds.dir;renderSheet();return}
    if(ds.goal){readTxForm();sh.data.goal=ds.goal;renderSheet();return}
    if(ds.cat){readAny();sh.data.cat=ds.cat;renderSheet();return}
    if(ds.rtype){readRecForm();sh.data.type=ds.rtype;if(CAT[sh.data.cat]?.type!==ds.rtype)sh.data.cat=visCats(ds.rtype)[0]?.key;renderSheet();return}
    if(ds.ctab){sh.data.type=ds.ctab;renderSheet();return}
    if(ds.ctype){readCatForm();sh.data.type=ds.ctype;renderSheet();return}
    if(ds.color){readAny();sh.data.color=ds.color;renderSheet();return}
  }
  const a=ds.action;if(!a)return;
  if(a==='prev'||a==='next'){S.month=shiftMonth(S.month,a==='prev'?-1:1);render()}
  else if(a==='new-tx')newTx();
  else if(a==='new-transfer')newTx('transfer');
  else if(a==='new-saving')newTx('saving');
  else if(a==='new-unsaving')newTx('saving',{dir:'out'});
  else if(a==='new-acc')openSheet({kind:'acc',data:{name:'',kind:'courant',initialStr:''}});
  else if(a==='new-goal'){const back=sh&&sh.kind==='tx'?(readTxForm(),sh):null;openSheet({kind:'goal',back,data:{name:'',targetStr:'',deadline:'',color:PALETTE[(S.goals.length+1)%PALETTE.length]}})}
  else if(a==='new-rec'){if(!S.accounts.length){toast("Ajoute d'abord un compte.");return}
    openSheet({kind:'rec',data:{type:'expense',note:'',amountStr:'',cat:'logement',account:S.accounts[0].id,day:1,start:ym(new Date()),active:true}})}
  else if(a==='cats')openCats(sh?.kind==='cat'?(CAT[sh.id]?.type||sh.data.type):'expense');
  else if(a==='new-cat')openSheet({kind:'cat',data:{name:'',type:sh?.data?.type||'expense',color:PALETTE[0],hidden:false}});
  else if(a==='export')exportCsv();
  else if(a==='close'){if(sh?.kind==='goal'&&sh.back){S.sheet=sh.back;renderSheet()}else closeSheet()}
  else if(a==='del-tx'){if(confirmOr(sh))del('transactions',sh.id,'Opération supprimée')}
  else if(a==='del-goal'){if(S.tx.some(x=>x.goal===sh.id)){sh.err='Cet objectif a des mouvements d\'épargne. Retire d\'abord l\'argent ou supprime ces opérations.';renderSheet();return}
    if(confirmOr(sh))del('goals',sh.id,'Objectif supprimé')}
  else if(a==='del-rec'){if(confirmOr(sh))del('recurring',sh.id,'Récurrente supprimée')}
  else if(a==='del-cat'){if(S.tx.some(x=>x.cat===sh.id)||S.recs.some(x=>x.cat===sh.id)){sh.err='Des opérations utilisent cette catégorie. Masque-la plutôt.';renderSheet();return}
    if(!confirmOr(sh))return;const type=CAT[sh.id]?.type;
    if(await guard(()=>q(S.sb.from('categories').delete().eq('key',sh.id)))){openCats(type);toast('Catégorie supprimée')}}
  else if(a==='del-acc'){
    if(S.tx.some(x=>x.account===sh.id||x.toAccount===sh.id)){sh.err='Ce compte a des opérations. Supprime-les ou garde le compte.';renderSheet();return}
    if(confirmOr(sh))del('accounts',sh.id,'Compte supprimé')}
  else if(a==='seed-acc'){if(await guard(()=>q(S.sb.from('accounts').insert([{name:'Compte courant',kind:'courant',initial:0,sort:1,user_id:S.user.id},{name:'Espèces',kind:'especes',initial:0,sort:2,user_id:S.user.id}]))))toast('Comptes créés')}
  else if(a==='reload'){S.status='loading';render();loadAll()}
  else if(a==='auth-toggle'){S.authMode=S.authMode==='login'?'signup':'login';S.authErr='';S.authMsg='';render()}
  else if(a==='logout'){await S.sb.auth.signOut()}
});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='auth-form'){doAuth();return}
  const k=S.sheet?.kind;({tx:saveTx,acc:saveAcc,budget:saveBudget,goal:saveGoal,rec:saveRec,cat:saveCat})[k]?.()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.sheet)closeSheet()});
document.addEventListener('input',e=>{if(e.target.id==='f-q'){S.filter.q=e.target.value;document.getElementById('ops-list').innerHTML=opsList()}});
document.addEventListener('change',e=>{
  if(e.target.id==='s-bm'&&S.sheet){readTxForm();S.sheet.data.bmManual=true;renderSheet();return}
  if(e.target.id==='s-date'&&S.sheet){const d=S.sheet.data;const oldDm=d.date.slice(0,7);readTxForm();
    if(!d.bmManual)d.bm=autoBm(d);else if(d.bm===oldDm)d.bm=d.date.slice(0,7);renderSheet();return}
  if(e.target.id==='f-acc'){S.filter.acc=e.target.value;document.getElementById('ops-list').innerHTML=opsList()}
  if(e.target.id==='f-cat'){S.filter.cat=e.target.value;document.getElementById('ops-list').innerHTML=opsList()}});

/* ---------- données (Supabase) ---------- */
let rt=0;function schedule(){cancelAnimationFrame(rt);rt=requestAnimationFrame(()=>{
  const fq=document.activeElement?.id==='f-q';if(fq&&S.tab==='ops'){document.getElementById('ops-list').innerHTML=opsList();return}
  render();if(S.sheet?.kind==='cats')renderSheet();})}
async function q(p){const {data,error}=await p;if(error)throw error;return data}
async function opt(p){try{return {rows:await q(p),ok:true}}catch(e){console.warn(e);return {rows:[],ok:false}}}
let loading=null;
function loadAll(){ if(loading) return loading; loading=(async()=>{
  try{
    const [acc,bud,gl,rc,ct]=await Promise.all([q(S.sb.from('accounts').select('*').order('sort')),q(S.sb.from('budgets').select('*')),
      opt(S.sb.from('goals').select('*').order('sort')),opt(S.sb.from('recurring').select('*').order('day')),opt(S.sb.from('categories').select('*'))]);
    let tx=[],from=0;
    for(;;){const page=await q(S.sb.from('transactions').select('*').order('date',{ascending:false}).range(from,from+999));tx=tx.concat(page);if(page.length<1000)break;from+=1000}
    S.schemaOld=!(gl.ok&&rc.ok&&ct.ok);
    S.accounts=acc.map(a=>({id:a.id,name:a.name,kind:a.kind,initial:Number(a.initial)||0,order:a.sort||0}));
    S.tx=tx.map(t=>({id:t.id,type:t.type,amount:Number(t.amount),account:t.account_id,toAccount:t.to_account_id,cat:t.category,goal:t.goal_id||null,date:t.date,bm:t.budget_month||null,note:t.note||'',createdAt:Date.parse(t.created_at)||0}));
    const b={};bud.forEach(r=>b[r.category]=Number(r.monthly_limit)||0);S.budgets=b;
    S.goals=gl.rows.map(g=>({id:g.id,name:g.name,target:g.target==null?null:Number(g.target),deadline:g.deadline,color:g.color,sort:g.sort}));
    S.recs=rc.rows.map(r=>({id:r.id,type:r.type,amount:Number(r.amount),cat:r.category,account:r.account_id,day:r.day,note:r.note||'',active:r.active,startMonth:r.start_month,lastMonth:r.last_month}));
    S.catRows=ct.rows;rebuildCats();
    S.status='ready';
  }catch(e){console.error(e);if(S.user)S.status='error'}
  finally{loading=null;schedule()}
})(); return loading}

async function doAuth(){
  const email=document.getElementById('au-email').value.trim(),password=document.getElementById('au-pass').value;
  S.authBusy=true;S.authErr='';S.authMsg='';render();
  document.getElementById('au-email').value=email;
  try{
    if(S.authMode==='signup'){
      const {data,error}=await S.sb.auth.signUp({email,password});if(error)throw error;
      if(!data.session){S.authMode='login';S.authMsg="Compte créé. Ouvre le lien de confirmation reçu par email, puis reviens te connecter ici."}
    }else{
      const {error}=await S.sb.auth.signInWithPassword({email,password});if(error)throw error;
    }
  }catch(e){
    const m=e?.message||'';
    S.authErr=/Invalid login/i.test(m)?'Email ou mot de passe incorrect.':/not confirmed/i.test(m)?"Ton email n'est pas encore confirmé. Ouvre le lien reçu par email.":/already registered/i.test(m)?'Ce compte existe déjà. Connecte-toi.':/signups? not allowed/i.test(m)?'La création de compte est fermée dans Supabase.':/fetch|network/i.test(m)?'Pas de connexion internet.':'Connexion impossible.';
    S.authErr+=m?' (Détail : '+m+')':'';
  }finally{S.authBusy=false;if(S.status==='auth'||S.status==='config'){render();const el=document.getElementById('au-email');if(el)el.value=email}}
}

function setUser(u){
  if((u?.id||null)===(S.user?.id||null)) return;
  S.user=u;
  if(u){S.status='loading';render();setTimeout(loadAll,0)}
  else{S.accounts=[];S.tx=[];S.budgets={};S.goals=[];S.recs=[];S.catRows=[];rebuildCats();S.status='auth';closeSheet();S.tab='home';render()}
}
(async()=>{
  const C=window.FINANCES_CONFIG||{};
  if(!window.supabase||!C.SUPABASE_URL||/VOTRE/.test(C.SUPABASE_URL+C.SUPABASE_ANON_KEY)){S.status=window.supabase?'config':'error';render();return}
  S.sb=window.supabase.createClient(C.SUPABASE_URL,C.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await S.sb.auth.getSession();
  if(session?.user) setUser(session.user); else {S.status='auth';render()}
  S.sb.auth.onAuthStateChange((_ev,session)=>setTimeout(()=>setUser(session?.user||null),0));
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&S.user)loadAll()});
})();
render();
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
