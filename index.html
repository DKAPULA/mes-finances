/* Identité Sarepta : jarre terre cuite, bande 4 couleurs (jaune, bleu ciel, bleu marine, bordeaux), Montserrat */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --sunk:#eef0f5; --line:#dfe3eb;
  --fg:#17213a; --muted:#5f6779;
  --navy:#204b99; --wine:#a0153c; --gold:#f6bb2f; --gold-ink:#7a5500; --gold-txt:#a9791a; --sky:#36abe1; --terra:#a35d4d;
  --hero:#1b3f82; --hero-ink:#ffffff; --hero-soft:#c9d6ef;
  --s1:#2f5db3; --s2:#b97f0a; --grid:#e6e9f0; --axis:#8a91a1;
  --ok:#1f7a4a; --ok-bg:#e3f3ea; --bad:#b4232f; --bad-bg:#fbe7e8; --warn-bg:#fdf1d6;
  --display:"Montserrat",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}

  --navy:#93b2ef; --wine:#f2768f; --gold:#f6bb2f; --gold-ink:#f6cd6a; --gold-txt:#e9be5a; --sky:#5cc0ee; --terra:#d39582;
  --hero:#1b3f82; --hero-ink:#ffffff; --hero-soft:#c9d6ef;
  --s1:#5f86d9; --s2:#b8851a; --grid:#252d3c; --axis:#7d869a;

  --navy:#93b2ef; --wine:#f2768f; --gold:#f6bb2f; --gold-ink:#f6cd6a; --gold-txt:#e9be5a; --sky:#5cc0ee; --terra:#d39582;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:relative;z-index:5;background:var(--surface);box-shadow:0 1px 0 var(--line)}
/* hors connexion */
.offbar{display:flex;align-items:flex-start;gap:9px;background:#fff4d6;color:#6b4b00;border-bottom:1px solid #f0d58a;padding:8px 16px;font-size:.84rem;font-weight:600;line-height:1.35}
.offbar[hidden]{display:none}.offbar.ok{background:#e3f4ea;color:#1f5f3a;border-color:#b9e0c8}.offbar b{font-weight:800}
:root[data-theme="dark"] .offbar{background:#3a2f12;color:#f3d58a;border-color:#5a4a1c}:root[data-theme="dark"] .offbar.ok{background:#173326;color:#9fe0bb;border-color:#24533b}
.savebar .q{display:block;font-size:.74rem;color:var(--gold-ink,#8a6200);font-weight:700}
.st.pend{color:#8a6200}.pill.p-pend{background:#fff4d6;color:#8a6200;border:1px solid #f0d58a}
/* en-tête réduit pendant le défilement */

@keyframes hdin{from{transform:translateY(-100%)}to{transform:none}}
header.top.compact .brand{padding-block:6px 2px;gap:10px}
header.top.compact .mark,header.top.compact .mark2{width:38px;height:38px}
header.top.compact .eyebrow,header.top.compact .verse,header.top.compact .bstat{display:none}
header.top.compact .brand h1{font-size:1.15rem}
.brand{display:flex;align-items:center;gap:12px;padding-block:12px 4px}
.btext{flex:1;min-width:0;text-align:center}

.bstat a{color:inherit}

.mark2 img{width:100%;height:100%;object-fit:contain}
.mark{width:clamp(48px,15vw,92px);height:clamp(48px,15vw,92px);border-radius:50%;display:grid;place-items:center;flex:none}
.mark img{width:100%;height:100%;object-fit:contain}
/* mode sombre : logo Sarepta posé sur une pastille claire (son cercle est noir) */
:root[data-theme="dark"] .mark{background:radial-gradient(circle,#f4f1ea 62%,rgba(244,241,234,0) 70%)}
@media (prefers-color-scheme: dark){:root:not([data-theme]) .mark{background:radial-gradient(circle,#f4f1ea 62%,rgba(244,241,234,0) 70%)}}
.band{display:grid;grid-template-columns:5fr 2fr 2fr 2fr;height:4px}
.band i:nth-child(1){background:#f6bb2f}.band i:nth-child(2){background:#36abe1}.band i:nth-child(3){background:#204b99}.band i:nth-child(4){background:#a0153c}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(1.15rem,5.4vw,2.1rem);margin:0;letter-spacing:-.01em;color:var(--fg);white-space:nowrap;line-height:1.15}
.brand h1 span{color:var(--wine)}
.brand .eyebrow{font-size:clamp(.62rem,2.5vw,.78rem);letter-spacing:.16em;font-weight:800;color:var(--gold-txt)}
.brand small{display:block;color:var(--muted);font-size:.78rem;font-weight:500}
.sync{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.on{background:var(--ok)} .dot.off{background:var(--bad)}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{cursor:pointer;user-select:none;padding:10px 12px;color:var(--muted);text-decoration:none;font-weight:600;font-size:.92rem;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--fg);border-color:var(--wine)}
nav.tabs a:focus-visible{outline:2px solid var(--navy);outline-offset:-2px}
main{padding-block:20px 60px}
.perm{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);min-width:0}
.perm>summary{list-style:none;display:flex;gap:10px;align-items:center;padding:12px 14px;cursor:pointer}
.perm>summary::-webkit-details-marker{display:none}
.perm>summary .grow{flex:1;min-width:0}
.perm>summary .sub{font-size:.82rem;color:var(--muted)}
.perm>summary .chev{color:var(--muted);transition:transform .15s}
.perm[open]>summary .chev{transform:rotate(90deg)}
.ptab{overflow-x:auto;border-top:1px solid var(--line);padding:0 14px 12px}
.ptab table{font-size:.86rem}
.ptab th{white-space:nowrap;vertical-align:bottom}
.ptab th .st{display:block;font-size:.66rem;letter-spacing:0;text-transform:none;font-weight:600}
.ptab td.tot,.ptab th.tot{font-weight:800;background:var(--sunk)}
.ptab th:first-child,.ptab td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:140px;max-width:180px;white-space:normal}
.ptab tfoot td:first-child{background:var(--surface)}
.ptab tfoot td{font-weight:800;border-top:2px solid var(--line);border-bottom:0}
.ptab tfoot tr.mad td{font-weight:600;color:var(--muted);border-top:0}
.ptab input{width:58px;text-align:center;padding:5px 4px;font-weight:700}
.ptab input.changed{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.ptab .note{font-size:.8rem;color:var(--muted);margin-top:8px}
.ptab .delcol{display:inline-block;margin-top:2px}
.tabbadge{display:inline-grid;place-items:center;min-width:18px;height:18px;border-radius:9px;background:#a0153c;color:#fff;font-size:.7rem;font-weight:800;margin-left:6px;padding:0 5px;vertical-align:2px}
.val-card{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:8px}
.val-card .vl{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.val-card .vl:first-of-type{border-top:0}
.val-card .vl .grow{flex:1;min-width:0;font-size:.9rem}
.val-card .vl input{width:80px;text-align:center;font-weight:700}
.val-card .vl.changed input{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.val-card .was{font-size:.75rem;color:var(--muted)}
.rec{display:grid;gap:14px}
.rec>*{min-width:0}
.ctx{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ctx .grow{flex:1;min-width:0}.ctx b{display:block}.ctx span{font-size:.84rem;color:var(--muted)}
.ctx.need{border-color:var(--wine);box-shadow:inset 0 0 0 1px var(--wine)}
.step-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 10px}
.step-h h3{margin:0}.step-h .n{font-size:.8rem;color:var(--muted);white-space:nowrap}
.items{margin-top:6px}
.items .cat-h{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:12px 0 2px}
.it{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.cat-h+.it{border-top:0}
.it .grow{flex:1;min-width:0;font-size:.92rem}
.it.has .grow{font-weight:700}
.stp{display:flex;align-items:center;gap:4px;flex:none}
.stp button{width:40px;height:40px;border-radius:50%;padding:0;font-size:1.25rem;line-height:1;display:grid;place-items:center}
.stp button.plus{background:var(--navy);border-color:var(--navy);color:#fff}
:root .stp button.plus{background:#204b99;border-color:#204b99}
.stp input{width:54px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;border:0;background:transparent;padding:6px 0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stp input:focus-visible{outline:2px solid var(--navy);border-radius:8px}
.it.has .stp input{color:var(--navy)}
.autre-add{display:flex;gap:8px;padding:8px 0 2px}
.autre-add input{flex:1}
.it .rm{width:32px;height:32px;padding:0;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1rem}
.it .tagnew{display:inline-block;font-size:.68rem;font-weight:700;color:var(--gold-ink);background:var(--warn-bg);border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:middle}
.more summary{cursor:pointer;font-weight:700;color:var(--navy);list-style:none}
.more summary::-webkit-details-marker{display:none}
.more[open] summary{margin-bottom:10px}
.more{display:grid;gap:10px}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.tg button{padding:12px 8px}
.tg button[aria-pressed=true]{background:#204b99;color:#fff;border-color:#204b99}
.savebar{position:sticky;bottom:0;z-index:4;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;align-items:center;box-shadow:0 -6px 16px rgba(10,20,40,.08)}
.savebar .grow{flex:1;min-width:0;font-size:.86rem;color:var(--muted)}
.savebar b{color:var(--fg);font-size:1rem}
.savebar button{padding:12px 22px}
.backbar{margin:-6px 0 10px}
button.back{padding:6px 10px 6px 4px;font-size:.9rem;color:var(--navy);font-weight:700}
button.back:hover{text-decoration:underline;text-underline-offset:3px}
.view{display:grid;gap:18px}
h2{font-family:var(--display);font-weight:800;font-size:1.45rem;margin:0;letter-spacing:-.015em;text-wrap:balance}
h3{font-family:var(--display);font-weight:600;font-size:1.08rem;margin:0 0 10px;text-wrap:balance}
.lede{color:var(--muted);margin:4px 0 0;max-width:62ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.grid2>*{min-width:0}
.eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
.banner{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);font-size:.9rem}
.banner[hidden]{display:none}
/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.next{background:var(--hero);color:var(--hero-ink);background-image:radial-gradient(circle at 100% 0,rgba(246,187,47,.22),transparent 45%);border-radius:var(--r);padding:20px;display:grid;gap:8px;align-content:start}
.next .eyebrow{color:#f6cd6a}
.next .big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.next .what{font-size:1.1rem;font-weight:600}
.next .after{font-size:.86rem;color:var(--hero-soft);border-top:1px solid rgba(255,255,255,.18);padding-top:10px;margin-top:6px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--display);font-size:1.7rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--muted)}
.meter{height:8px;border-radius:5px;background:var(--sunk);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--s1);border-radius:5px}
/* lists */
.rows{display:grid}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .grow{flex:1;min-width:0}
.row .sub{font-size:.82rem;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:700;white-space:nowrap}
.p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
.p-warn{background:var(--warn-bg);color:var(--gold-ink)} .p-mut{background:var(--sunk);color:var(--muted)}
.empty{color:var(--muted);font-size:.9rem;padding:14px 0}
/* forms */
label{font-size:.82rem;font-weight:600;color:var(--muted);display:grid;gap:4px}
input,select,textarea{font:inherit;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--navy);outline-offset:0;border-color:transparent}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:10px}
button{font:inherit;font-weight:700;border-radius:8px;padding:9px 14px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
button:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
button.primary{background:#a0153c;border-color:#a0153c;color:#fff}
button.ghost{border-color:transparent;background:transparent;color:var(--muted);padding:6px 8px}
button.small{padding:5px 10px;font-size:.82rem}
button:disabled{opacity:.5;cursor:not-allowed}
.lines{display:grid;gap:8px;margin:12px 0}
.line{display:grid;grid-template-columns:minmax(0,1fr) 90px auto;gap:8px;align-items:center}
.line .hint{grid-column:1/-1;font-size:.78rem;color:var(--muted);margin-top:-4px}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:.84rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
/* table */
.tbl-wrap{overflow-x:auto;margin:0 -16px;padding:0 16px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:700;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left;padding-left:0}
td{padding:8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
td.name{min-width:200px}
tr.cat td{background:var(--sunk);font-weight:700;text-align:left;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:6px 8px}
.bar{display:block;height:4px;background:var(--sunk);border-radius:3px;margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.neg{color:var(--bad);font-weight:700} .pos{color:var(--ok);font-weight:700}
/* cibles */
.cibles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.cible{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.cible h3{margin:0;color:var(--fg)}
.cible{border-top:3px solid var(--terra)}
.cible .who{font-size:.86rem;font-weight:600}
.cible p{margin:0;font-size:.9rem;color:var(--muted)}
.cible.open{cursor:pointer;transition:border-color .15s, box-shadow .15s}
.cible.open:hover,.cible.open:focus-visible{border-color:var(--navy);box-shadow:0 2px 10px rgba(20,40,90,.08);outline:none}
.cible .stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.cible .stats span{font-size:.78rem;font-weight:600;color:var(--muted);background:var(--sunk);border-radius:999px;padding:3px 9px}
.cible .stats span.ok{color:var(--ok);background:var(--ok-bg)}
.cible .go{font-weight:700;color:var(--navy)}
.cible-head{display:grid;gap:4px}
.cible-head h2{margin:0}
.cible-head .who{font-weight:600}
.cible-head p{margin:0;color:var(--muted);max-width:62ch}
.ben{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.ben:first-child{border-top:0}
.ben .grow{flex:1;min-width:0}
.ben .nm{font-weight:600}
.ben .nm[data-ben-info]{cursor:pointer;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.bs-eb{font-size:.72rem;letter-spacing:.14em;font-weight:800;color:var(--gold-txt);text-transform:uppercase}
.bs-dl{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:12px 0 4px;font-size:.93rem}.bs-dl dt{color:var(--muted)}.bs-dl dd{margin:0;font-weight:600}
.bs-com{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:10px;font-size:.92rem;white-space:pre-wrap}
.ben .sub{font-size:.8rem;color:var(--muted)}
.ben-toggle{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;border-radius:999px;padding:6px 12px;font-size:.82rem}
.ben-toggle .box{width:16px;height:16px;border-radius:50%;border:2px solid var(--axis);display:inline-grid;place-items:center;font-size:11px;line-height:1}
.ben-toggle.on{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.ben-toggle.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.ben-sum{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted);margin:2px 0 4px}
.cible .foot{display:flex;justify-content:space-between;align-items:center;font-size:.82rem;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
/* timeline */
.tl{display:grid}
.ev{display:grid;grid-template-columns:96px 1fr;gap:14px;padding:12px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev .d{font-variant-numeric:tabular-nums;font-weight:700;color:var(--navy);font-size:.92rem}
.ev .d small{display:block;color:var(--muted);font-weight:500;font-size:.78rem}
.ev.past{opacity:.55}
.ev.now .d{color:var(--wine)}
.slots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.slot{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface)}
.slot b{display:block;font-family:var(--display);font-size:1.05rem}
.slot span{font-size:.85rem;color:var(--muted)}
.slot.next-slot{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.colis-card{border:1px solid var(--line);border-radius:var(--r);padding:12px;background:var(--surface);display:grid;gap:6px}
.colis-card ul{margin:0;padding-left:18px;font-size:.88rem;color:var(--muted)}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:.82rem}

/* tableau de bord */
.dons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:18px}
.dons>*{min-width:0}
.donut-card{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:center}
@media (max-width:480px){.donut-card{grid-template-columns:110px minmax(0,1fr);gap:14px}.donut-card .big{font-size:1.3rem}.lg{font-size:.8rem}}
.donut-card svg{width:100%;height:auto;display:block}
.donut-card h3{margin:0 0 4px}
.donut-card .big{font-family:var(--display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums;line-height:1.15}
.donut-card .sub{color:var(--muted);font-size:.86rem}
.lg{display:grid;gap:6px;margin-top:10px;font-size:.86rem}
.lg span{display:flex;align-items:center;gap:8px}.lg i{width:10px;height:10px;border-radius:3px;flex:none}
.lg b{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.fin2{display:grid;gap:12px;margin-top:8px}
.fl-h{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.86rem}.fl-h i{width:10px;height:10px;border-radius:3px;flex:none}
.fl-v{font-family:var(--display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;line-height:1.2}
.fin-tot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:12px;border-top:2px solid var(--fg);padding-top:10px}
.fin-tot>span:first-child{font-weight:700}.fin-tot>span:last-child{text-align:right}.fin-tot b{display:block;font-family:var(--display);font-size:1.2rem;font-variant-numeric:tabular-nums}
.fin-tot .sub i{display:inline-block;width:9px;height:9px;border-radius:2px;vertical-align:middle}
@media (max-width:480px){.fl-v{font-size:1.1rem}}
.view>*,.dons>*,.donut-card>*{min-width:0}.fin-tot{flex-wrap:wrap}
@media (max-width:360px){.donut-card{grid-template-columns:88px minmax(0,1fr);gap:10px}.fl-v{font-size:1rem}.fin-tot b{font-size:1.05rem}}
.ctr1{font-family:var(--display);font-weight:800;font-size:26px;fill:var(--fg)}
.ctr2{font-size:11px;fill:var(--muted)}
#dArts td.ok{color:var(--ok);font-weight:700;white-space:nowrap}
#dArts .bar i{background:var(--s1)}
@media (max-width:480px){#dArts td.name{min-width:140px}}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.filters .actions{gap:10px}
.filters select{width:auto}
.dkpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.dkpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px;align-content:start}
.dkpi .lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.dkpi b{font-family:var(--display);font-size:1.75rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.15}
.dkpi .delta{font-size:.78rem;color:var(--muted)}
.dkpi .delta .up{color:var(--ok);font-weight:700}.dkpi .delta .down{color:var(--bad);font-weight:700}
.chart-head{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.chart-head h3{margin:0}
.chart-head .sub{font-size:.82rem;color:var(--muted);margin-top:2px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted);margin:6px 0 2px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.8rem;box-shadow:0 6px 18px rgba(10,20,40,.14);min-width:140px;z-index:2;white-space:nowrap}
.tip b{display:block;margin-bottom:4px;font-size:.82rem}
.tip .r{display:flex;justify-content:space-between;gap:14px;font-variant-numeric:tabular-nums}
.tip .r span{display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.tip .r i{width:8px;height:8px;border-radius:2px;display:inline-block}
.hbars{display:grid;gap:12px}
.hbar .top{display:flex;justify-content:space-between;gap:10px;font-size:.88rem}
.hbar .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.hbar .track{height:10px;border-radius:5px;background:var(--sunk);margin-top:6px;display:flex;gap:2px;overflow:hidden}
.hbar .track i{display:block;height:100%}
.hbar .track i:first-child{border-radius:5px 0 0 5px}.hbar .track i:last-child{border-radius:0 5px 5px 0}.hbar .track i:only-child{border-radius:5px}
.linkbtn{background:none;border:0;color:var(--navy);padding:0;font-weight:600;font-size:.82rem;text-decoration:underline;text-underline-offset:3px}
.dtable{max-height:260px;overflow:auto;margin-top:10px;border-top:1px solid var(--line)}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.rank:first-child{border-top:0}
.rank .n{color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.rank .track{height:6px;border-radius:3px;background:var(--sunk);margin-top:5px;overflow:hidden}
.rank .track i{display:block;height:100%;background:var(--s1);border-radius:3px}
.rank b{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:20}
@media (prefers-reduced-motion:no-preference){.meter i,.bar i{transition:width .4s ease}}
</style>

<style>
.top .mark{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
header.top.compact .mark{width:46px;height:46px;margin:-4px -4px -4px 0}
.top .mark img{pointer-events:none}
.gate{position:fixed;inset:0;z-index:50;background:rgba(24,33,58,.45);display:flex;align-items:flex-end;justify-content:center}
.gate-sheet{background:var(--surface,#fff);width:100%;max-width:480px;border-radius:22px 22px 0 0;padding:22px 18px calc(22px + env(safe-area-inset-bottom))}

</style>

<script>

(function(){
const st={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
const q=new URLSearchParams(location.search);
const home=st.get("c26-home");
if(home&&/^\/[a-z]+$/.test(home)&&!q.has("tdb")){location.replace(home);return}
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("/sw.js").catch(()=>{}));
const g=document.getElementById("gate"),mark=document.querySelector(".top .mark");let t=null;
let openedAt=0;function open(){openedAt=Date.now();g.hidden=false;document.getElementById("gateErr").textContent="";const i=document.getElementById("gateCode");i.value="";setTimeout(()=>i.focus(),50)}
function close(){g.hidden=true}
if(mark){
  const start=e=>{clearTimeout(t);t=setTimeout(()=>{t=null;if(navigator.vibrate)navigator.vibrate(15);open()},800)};
  const stop=()=>{clearTimeout(t);t=null};
  mark.addEventListener("pointerdown",start);["pointerup","pointerleave","pointercancel","pointermove"].forEach(ev=>mark.addEventListener(ev,e=>{if(ev==="pointermove"&&(Math.abs(e.movementX)+Math.abs(e.movementY))<6)return;stop()}));
  mark.addEventListener("contextmenu",e=>e.preventDefault());
}
document.getElementById("gateNo").onclick=close;
g.addEventListener("click",e=>{if(e.target===g&&Date.now()-openedAt>700)close()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!g.hidden)close()});
document.getElementById("gateForm").addEventListener("submit",async e=>{e.preventDefault();
  const c=document.getElementById("gateCode").value.trim();if(!c)return;const b=document.getElementById("gateBtn");b.disabled=true;document.getElementById("gateErr").textContent="";
  try{const r=await fetch("/api/rpc",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({fn:"connexion",args:[c]})});const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||"Code incorrect.");
    const res=j.result||{};Object.entries(res.garder||{}).forEach(([k,v])=>{if(/^c26-[a-z]+$/.test(k))st.set(k,v)});
    if(/^\/[a-z]+$/.test(res.aller||"")){st.set("c26-home",res.aller);location.href=res.aller}
  }catch(err){document.getElementById("gateErr").textContent=/connexion|fetch/i.test(err.message)?"Pas de connexion internet.":"Code incorrect."}
  b.disabled=false});
})();
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=n=>(Math.round(Number(n||0)*10)/10).toLocaleString("fr-FR");
const S={pub:null};
const MOIS=["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];
const JOURS=["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const todayISO=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const dLabel=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return d+" "+MOIS[m-1]};
const dLong=iso=>{if(!iso)return"";const [y,m,d]=iso.split("-").map(Number);return JOURS[new Date(y,m-1,d).getDay()]+" "+d+" "+MOIS[m-1]};
function artName(id){const a=S.articles.find(x=>x.id===id);return a?a.nom:String(id||"")}
function setSync(state,txt){$("#syncDot").className="dot "+(state||"");$("#syncTxt").textContent=txt}
function banner(t){const b=$("#banner");b.textContent=t||"";b.hidden=!t}
/* ---------- tableau de bord ---------- */

function dashData(){
  if(S.pub)return S.pub;
  const recu={};S.receptions.filter(isVal).forEach(r=>(r.lignes||[]).forEach(l=>recu[l.article]=(recu[l.article]||0)+Number(l.qte||0)));
  const f=S.finance||{objectif:50000,objectifNature:100000,financier:0,nature:0};
  return {articles:S.articles,recu,finance:{objectif:f.objectif,objectifNature:f.objectifNature,financier:f.financier||0,nature:f.nature||0}};
}

function donutSvg(parts,label){
  const r=60,c=2*Math.PI*r;let off=0,arcs="";
  const total=parts.reduce((s,p)=>s+p.v,0);
  parts.forEach(p=>{const l=Math.max(0,p.v)*c;if(l<=0)return;const gap=parts.filter(x=>x.v>0).length>1&&total<0.999||parts.filter(x=>x.v>0).length>1?1.5:0;
    arcs+=`<circle cx="80" cy="80" r="${r}" fill="none" stroke="${p.color}" stroke-width="22" stroke-dasharray="0 ${off.toFixed(1)} ${Math.max(0.5,l-gap).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 80 80)"/>`;off+=l});
  return `<svg viewBox="0 0 160 160" role="img" aria-label="${Math.round(total*100)} % ${label}"><circle cx="80" cy="80" r="${r}" fill="none" stroke="var(--sunk)" stroke-width="22"/>${arcs}<text x="80" y="84" text-anchor="middle" class="ctr1">${Math.round(Math.min(1,total)*100)} %</text><text x="80" y="102" text-anchor="middle" class="ctr2">${label}</text></svg>`;
}
const LG_REST='background:var(--sunk);box-shadow:inset 0 0 0 1px var(--line)';
function renderDash(){
  const d=dashData();
  const oF=Number(d.finance.objectif||0),oN=Number(d.finance.objectifNature==null?100000:d.finance.objectifNature),fi=Number(d.finance.financier||0),na=Number(d.finance.nature||0);
  const tot=oF+oN,att=Math.max(tot-fi-na,0),base=Math.max(tot,fi+na)||1;
  const ligne=(col,lbl,obj,rec)=>`<div class="fl"><div class="fl-h"><i style="background:${col}"></i>${lbl}</div><div class="fl-v">${fmt(obj)} MAD</div><div class="sub">${fmt(rec)} reçus · ${rec>=obj&&obj?"objectif atteint":"reste "+fmt(Math.max(obj-rec,0))}</div></div>`;
  $("#dFin").innerHTML=`${donutSvg([{v:fi/base,color:"var(--s1)"},{v:na/base,color:"var(--s2)"}],"couvert")}<div><h3>Besoin financier</h3><div class="fin2">${ligne("var(--s1)","Dons financiers",oF,fi)}${ligne("var(--s2)","Estimation besoin en nature",oN,na)}</div></div>
    <div class="fin-tot"><span>Total</span><span><b>${fmt(tot)} MAD</b><span class="sub">${fmt(fi+na)} reçus · <i style="${LG_REST}"></i> ${fmt(att)} en attente</span></span></div>`;
  const wn=d.articles.filter(a=>a.besoin);
  const need=wn.reduce((s,a)=>s+a.besoin,0),got=wn.reduce((s,a)=>s+Math.min(d.recu[a.id]||0,a.besoin),0);
  $("#dCouv").innerHTML=`${donutSvg([{v:need?got/need:0,color:"var(--s1)"}],"couvert")}<div><h3>Besoins couverts</h3><div class="big">${fmt(got)} articles</div><div class="sub">reçus sur ${fmt(need)} articles nécessaires</div>
    <div class="lg"><span><i style="background:var(--s1)"></i>Couvert<b>${fmt(got)}</b></span><span><i style="${LG_REST}"></i>Manque<b>${fmt(need-got)}</b></span></div></div>`;
  const arts=d.articles.slice().sort((a,b)=>(a.ordre||0)-(b.ordre||0));
  const cats=["Alimentaire","Boissons & lait","Bébé & entretien","Vêtements"];[...new Set(arts.map(a=>a.cat))].forEach(c=>{if(!cats.includes(c))cats.push(c)});
  let html="";
  cats.forEach(c=>{const list=arts.filter(a=>a.cat===c);if(!list.length)return;
    html+=`<tr class="cat"><td colspan="4">${esc(c)}</td></tr>`;
    html+=list.map(a=>{const r=d.recu[a.id]||0;
      if(!a.besoin)return `<tr><td class="name">${esc(a.nom)}</td><td><span style="color:var(--muted)">à définir</span></td><td>${fmt(r)}</td><td>–</td></tr>`;
      const pct=Math.min(100,Math.round(r/a.besoin*100)),m=Math.max(a.besoin-r,0);
      return `<tr><td class="name">${esc(a.nom)}<span class="bar"><i style="width:${pct}%"></i></span></td><td>${fmt(a.besoin)}</td><td>${fmt(r)}</td>${m?`<td class="neg">−${fmt(m)}</td>`:`<td class="ok" title="Besoin couvert">✓</td>`}</tr>`}).join("")});
  $("#dArts").innerHTML=html||`<tr><td colspan="4" class="empty" style="text-align:left">Chargement des articles…</td></tr>`;
}


let loaded=false;
async function load(){
  try{
    const r=await fetch("/api/rpc",{headers:{"Accept":"application/json"}});const j=await r.json().catch(()=>({}));
    if(!r.ok||!j.ok)throw new Error(j.error||"Erreur ("+r.status+")");
    S.pub=j.result;loaded=true;banner("");
    const t=new Date(S.pub.majLe||Date.now());setSync("on","Mis à jour à "+String(t.getHours()).padStart(2,"0")+"h"+String(t.getMinutes()).padStart(2,"0"));
    renderDash();
  }catch(e){setSync("off","Hors connexion");if(!loaded)banner("Les chiffres ne peuvent pas être chargés pour le moment. Réessayez dans un instant.")}
}
load();
setInterval(()=>{if(!document.hidden)load()},60000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
})();
</script>
