/* Layout : app mobile. En-tête blanc collant avec la jarre + bande aux 4 couleurs du logo ; une colonne ; onglets en bas. */
:root{
  --bg:#f5f6f9; --surface:#ffffff; --sunk:#eef0f5; --ink:#17213a; --muted:#5f6779; --line:#dfe3eb;
  --clay:#a0153c; --clay-soft:#fbe7ec; --on-clay:#ffffff;
  --wheat:#f6bb2f; --sky:#36abe1; --navy:#204b99; --crimson:#a0153c;
  --ok:#1f7a4a; --warn:#a9791a; --no:#b4232f; --idle:#8a91a1; --gold-txt:#a9791a;
  --wm-filter:none;
  --f-display:"Montserrat","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:16px; --shadow:0 1px 2px rgb(23 21 19 / .05), 0 2px 10px rgb(23 21 19 / .04);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141d; --surface:#181e2a; --sunk:#141924; --ink:#e9ecf3; --muted:#9ba3b4; --line:#2a3242;
  --clay:#f2768f; --clay-soft:#3a1a24; --on-clay:#10141d;
  --wheat:#f6bb2f; --sky:#5cc0ee; --navy:#93b2ef; --crimson:#f2768f;
  --ok:#5fcf94; --warn:#e9be5a; --no:#ff8790; --idle:#7d869a; --gold-txt:#e9be5a;
  --wm-filter:invert(1); --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141d; --surface:#181e2a; --sunk:#141924; --ink:#e9ecf3; --muted:#9ba3b4; --line:#2a3242;
  --clay:#f2768f; --clay-soft:#3a1a24; --on-clay:#10141d;
  --wheat:#f6bb2f; --sky:#5cc0ee; --navy:#93b2ef; --crimson:#f2768f;
  --ok:#5fcf94; --warn:#e9be5a; --no:#ff8790; --idle:#7d869a; --gold-txt:#e9be5a;
  --wm-filter:invert(1); --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--clay);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:620px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
svg.i{width:20px;height:20px;flex:none}

/* En-tête */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface)}
.hd{display:flex;align-items:center;gap:10px;padding-block:10px}
.jar{flex:none;width:44px;height:44px;border-radius:50%;background:#fff var(--jar) center/128% no-repeat;box-shadow:0 0 0 1px var(--line)}
.brand{min-width:0;flex:1;line-height:1}
.brand .eb{white-space:nowrap;font-family:var(--f-display);font-weight:800;font-size:.56rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.brand h1{font-family:var(--f-display);font-weight:900;font-size:1.45rem;letter-spacing:-.01em;margin:2px 0 0}
.sync{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;color:var(--muted);margin-top:4px;font-weight:700}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.sync.saving i{background:var(--wheat);animation:pulse 1s infinite}
.sync.error i{background:var(--no)}
@keyframes pulse{50%{opacity:.3}}
.month{display:flex;align-items:center;background:var(--sunk);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:999px;color:var(--muted);display:grid;place-items:center}
.month button:hover{background:var(--surface)}
.month span{font-weight:700;font-size:.86rem;min-width:6.8em;text-align:center;text-transform:capitalize;font-variant-numeric:tabular-nums}
.stripe{display:flex;height:4px}
.stripe i{display:block}
.stripe i:nth-child(1){flex:62;background:var(--wheat)} .stripe i:nth-child(2){flex:13;background:var(--sky)}
.stripe i:nth-child(3){flex:13;background:var(--navy)} .stripe i:nth-child(4){flex:12;background:var(--crimson)}

main{padding-block:18px 128px;display:flex;flex-direction:column;gap:14px}
h2{font-family:var(--f-display);font-weight:800;font-size:1.3rem;margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:800}
.hint{font-size:.85rem;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.note{font-size:.9rem;color:var(--muted);background:var(--sunk);border-radius:12px;padding:10px 12px}
.note.err{color:var(--no)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:700;font-size:.93rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--ink);text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--clay);border-color:var(--clay);color:var(--on-clay)}
.btn.dark{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.danger{color:var(--no)}
.btn.danger.solid{background:var(--no);border-color:var(--no);color:#fff}
.btn.small{padding:6px 12px;font-size:.85rem;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:default}
.link{border:0;background:none;color:var(--clay);font-weight:700;padding:4px 0;font-size:.92rem}

/* Avatar ouvrier */
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem;color:#fff;background:var(--c,var(--clay))}
.av.lg{width:52px;height:52px;font-size:1.3rem}

/* Accueil / choix du nom */
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding-block:6px 4px}
.hero .jarbig{width:116px;height:116px;border-radius:50%;background:#fff var(--jar) center/112% no-repeat;box-shadow:0 0 0 1px var(--line),var(--shadow)}
.hero .wm{width:220px;max-width:70%;height:auto;filter:var(--wm-filter);margin-top:8px}
.hero p{margin:0;color:var(--muted)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.list>.li:first-child,.list>:first-child{border-top:0}
button.li:hover,.li.click:hover{background:var(--sunk)}
.li .tx{flex:1;min-width:0}
.wli{padding:0 14px 0 0}
.wopen{display:flex;align-items:center;gap:12px;flex:1;min-width:0;border:0;background:none;padding:12px 0 12px 14px;text-align:left;color:inherit}
.wopen:hover{background:var(--sunk)}
.wmeta{display:flex !important;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:3px}
.wli .wtrack{margin-right:10px}
.li .tx .badge{font-size:.74rem}
.li .tx .badge.done{color:#fff}
.li .tx .badge.part{color:var(--warn)}
.li .tx b{display:block;font-weight:700;overflow-wrap:anywhere}
.li .tx span{font-size:.84rem;color:var(--muted)}
.chev{color:var(--muted)}
.frac{font-variant-numeric:tabular-nums;font-weight:700;font-size:.9rem;color:var(--muted)}
.done-badge{display:inline-flex;align-items:center;gap:4px;font-size:.78rem;font-weight:700;color:var(--ok)}

/* Bandeau de l'ouvrier */
.me{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.me-top{display:flex;align-items:center;gap:12px}
.me-top .tx{flex:1;min-width:0}
.me-top b{display:block;font-family:var(--f-display);font-weight:800;font-size:1.2rem;line-height:1.15}
.track{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;display:flex}
.track i{display:block;height:100%}
.track .ok{background:var(--ok)} .track .warn{background:var(--warn)} .track .no{background:var(--no)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.no{background:var(--no)} .dot.idle{background:var(--idle)}
.bravo{display:flex;align-items:center;gap:10px;background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok);border-radius:12px;padding:10px 12px;font-weight:700;font-size:.92rem}

/* Filtres */
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 11px;font-weight:700;font-size:.86rem;color:var(--muted)}
.chip b{font-variant-numeric:tabular-nums;margin-left:4px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] b{color:var(--bg)}

/* Carte d'appel */
.group-h{display:flex;align-items:center;gap:10px;margin-top:8px}
.group-h .av{width:30px;height:30px;font-size:.8rem}
.group-h h3{font-family:var(--f-display);font-weight:800;font-size:1rem;margin:0;flex:1}
.call{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);overflow:hidden}
.call::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--line)}
.call.ok::before{background:var(--ok)} .call.warn::before{background:var(--warn)} .call.no::before{background:var(--no)}
.call-top{display:flex;gap:10px;align-items:flex-start}
.call-top .tx{flex:1;min-width:0}
.call h4{margin:0;font-size:1.1rem;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:5px;font-size:.95rem;color:var(--muted)}
.tel{font-variant-numeric:tabular-nums;color:var(--ink);font-weight:700;letter-spacing:.03em;user-select:all}
.tc{font-size:.7rem;font-weight:800;border-radius:6px;padding:2px 6px;background:var(--sunk);color:var(--muted);letter-spacing:.04em}
.pnote{font-size:.85rem;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:6px;flex:none}
.ic{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);text-decoration:none}
.ic:hover{border-color:var(--muted)}
.ic.call-btn{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ic.wa{color:#1f9c55}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 4px 8px;font-weight:700;font-size:.82rem;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted)}
.seg button svg{width:20px;height:20px}
.seg button[data-v="vient"]:hover{border-color:var(--ok);color:var(--ok)}
.seg button[data-v="pas_repondu"]:hover{border-color:var(--warn);color:var(--warn)}
.seg button[data-v="vient_pas"]:hover{border-color:var(--no);color:var(--no)}
.seg button[data-v="vient"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.seg button[data-v="pas_repondu"][aria-pressed="true"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg button[data-v="vient_pas"][aria-pressed="true"]{background:var(--no);border-color:var(--no);color:#fff}
textarea,input[type=text],input[type=tel],input[type=password],select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:46px}
.foot{display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);min-height:20px}
.foot .saved{color:var(--ok);font-weight:700}

/* Bilan */
.sum{display:flex;align-items:center;gap:18px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.ring{flex:none;width:104px;height:104px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-weight:900;font-size:1.5rem;font-variant-numeric:tabular-nums}
.sum .tx{min-width:0}
.sum .big .persons{font-family:var(--f-body);font-size:.9rem;font-weight:700;color:var(--muted);margin-left:4px;white-space:nowrap}
.sum .big{font-family:var(--f-display);font-weight:900;font-size:2rem;line-height:1;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;box-shadow:var(--shadow)}
.stat b .persons{font-family:var(--f-body);font-size:.85rem;font-weight:700;color:var(--muted);margin-left:4px;white-space:nowrap}
.stat b{font-family:var(--f-display);font-weight:900;font-size:1.7rem;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:.82rem;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:6px}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.no b{color:var(--no)} .stat.idle b{color:var(--idle)}
.badge{font-size:.74rem;font-weight:700;border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.done{background:var(--ok);color:#fff}
.badge.part{background:color-mix(in srgb,var(--wheat) 26%,transparent);color:var(--warn)}
.badge.none{background:var(--sunk);color:var(--muted)}
.wtrack{height:5px;margin-top:6px}
details.list summary{padding:13px 14px;font-weight:700;cursor:pointer;display:flex;gap:9px;align-items:center;list-style:none}
details.list summary::-webkit-details-marker{display:none}
details.list summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);margin-left:auto;margin-right:4px}
details.list[open] summary::after{transform:rotate(-135deg)}
details.list[open] summary{border-bottom:1px solid var(--line)}
.lrow{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
details.list summary + .lrow{border-top:0}
.lrow .cm{font-size:.88rem;font-style:italic}

/* Gestion */
.seg-tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px}
.seg-tabs button{flex:1;border:0;background:none;padding:9px 4px;border-radius:10px;font-weight:700;color:var(--muted);font-size:.86rem}
.seg-tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0 / .1)}
.addline{display:flex;gap:8px}
.addline input{flex:1;min-width:0}
.search{position:relative;flex:1;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:18px;height:18px}
.search input{padding-left:38px}
.sub-h{font-family:var(--f-display);font-weight:800;font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:10px 14px 6px;background:var(--sunk);border-top:1px solid var(--line)}
.list>.sub-h:first-child{border-top:0}
code{font-size:.85em;background:var(--sunk);padding:1px 5px;border-radius:5px}

/* Feuille d'édition */
.scrim{position:fixed;inset:0;background:rgb(10 9 8 / .5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.grip{width:40px;height:5px;border-radius:99px;background:var(--line);align-self:center}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:.82rem;font-weight:700;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 110px;gap:10px}

/* Export image */
.exp-prev{border:1px solid var(--line);border-radius:12px;overflow:auto;max-height:46vh;background:#fff}
.exp-prev img{display:block;width:100%;height:auto}
.check{display:flex;align-items:center;gap:10px;font-weight:700;font-size:.92rem}
.check input{width:20px;height:20px;accent-color:var(--clay)}

/* Code d'accès */
.gate{display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px;padding-top:24px}
.gate form{width:100%;max-width:340px;display:flex;flex-direction:column;gap:10px}
.gate input{text-align:center;font-size:1.2rem;letter-spacing:.1em;padding:14px}
.gate .tpv{font-family:var(--f-display);font-weight:600;font-size:.68rem;letter-spacing:.32em;color:var(--muted)}

/* Onglets du bas */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
nav.tabs button{border:0;background:none;padding:8px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);font-size:.74rem;font-weight:700}
nav.tabs button span.pill{display:grid;place-items:center;width:56px;height:30px;border-radius:999px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink)}
nav.tabs button[aria-current="page"] span.pill{background:var(--clay-soft);color:var(--clay)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;font-weight:700;z-index:50;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .2)}
.empty{text-align:center;padding:28px 16px;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;align-items:center;gap:10px}
.empty b{color:var(--ink)}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--sunk),var(--surface),var(--sunk));background-size:200% 100%;animation:sk 1.4s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:380px){.month span{min-width:5.6em;font-size:.8rem}.brand h1{font-size:1.25rem}.seg button{font-size:.76rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (prefers-reduced-motion:no-preference){.seg button,.chip,.btn,.ic{transition:background-color .15s,border-color .15s,color .15s}}

/* Charte Compassion (hub Vercel) */
.hd{gap:8px;padding-block:12px 4px}
.mk,.mk2{flex:none;width:clamp(48px,15vw,92px);height:clamp(48px,15vw,92px);display:grid;place-items:center;border-radius:50%}
.mk img,.mk2 img{width:100%;height:100%;object-fit:contain}
:root[data-theme="dark"] .mk{background:radial-gradient(circle,#f4f1ea 62%,rgba(244,241,234,0) 70%)}
.brand{text-align:center;line-height:1.1}
.brand .eb{color:var(--gold-txt);font-size:clamp(.6rem,2.4vw,.74rem);white-space:normal}
.brand h1{font-weight:800;font-size:clamp(1.25rem,5.6vw,1.9rem);margin:2px 0 4px}
.brand .month{display:inline-flex}
.verse{text-align:center;color:var(--muted);font-weight:500;font-size:clamp(8.6px,2.8vw,.82rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:6px}
.bstat{display:flex;justify-content:center;align-items:center;gap:4px;color:var(--muted);font-size:.74rem;padding-bottom:8px;flex-wrap:wrap}
.bstat .sync{margin:0}.bstat a{color:inherit}
.stripe i:nth-child(1){flex:40}.stripe i:nth-child(2){flex:20}.stripe i:nth-child(3){flex:20}.stripe i:nth-child(4){flex:20}
main{padding-block:18px 24px}
.pfoot{text-align:center;color:var(--muted);font-size:.8rem;padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:620px;margin:0 auto}
.themebtn{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:26;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:18px;line-height:1;display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 12px rgba(16,20,29,.18)}
.toast{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
header{position:relative!important;top:auto!important}
header.compact{position:fixed!important;left:0;right:0;top:0!important;padding-top:env(safe-area-inset-top,0px);animation:hdin .18s ease-out}
@keyframes hdin{from{transform:translateY(-100%)}to{transform:none}}
header.compact .hd{padding-block:6px 4px}
header.compact .mk,header.compact .mk2{width:38px;height:38px}
header.compact .eb,header.compact .verse,header.compact .bstat{display:none}
header.compact .brand h1{font-size:1.05rem;margin:0 0 2px}
</style>

const lsGet = k => { try { return localStorage.getItem(k) } catch(e){ return null } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v) } catch(e){} };
const pad = n => String(n).padStart(2,'0');
const nowMonth = () => { const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1) };
const shiftMonth = (m,k) => { const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+k,1); return d.getFullYear()+'-'+pad(d.getMonth()+1) };
const monthName = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long',year:'numeric'}) };
const monthOnly = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('fr-FR',{month:'long'}) };
const cap = s => s ? s.charAt(0).toUpperCase()+s.slice(1) : s;
const nice = n => String(n||'').trim().replace(/\s+/g,' ');
// Prénom pour l'image : « lucrece » ou « LUCRECE » → « Lucrece »
const prenomOf = w => { const p = nice(w.short) || nice(w.name); return p.toLowerCase().replace(/(^|[\s-])(\p{L})/gu, (m,a,b)=>a+b.toUpperCase()); };
const ico = (id, cls='i') => `<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const plural = (n, one, many) => n+' '+(n>1?many:one);

function telInfo(raw){
  let d = String(raw||'').replace(/\D/g,''); if (d.startsWith('00')) d = d.slice(2);
  if (!d) return null;
  let intl = null;
  if (d.startsWith('212') && d.length===12) intl = '+'+d;
  else if (d.length===10 && d[0]==='0') intl = '+212'+d.slice(1);
  else if (d.length===9 && /[5-7]/.test(d[0])) intl = '+212'+d;
  else if (d.length>=8) intl = '+'+d;
  const local = intl && intl.startsWith('+212') ? '0'+intl.slice(4) : d;
  const pretty = local.length===10 ? local.replace(/(\d{2})(?=\d)/g,'$1 ').trim() : String(raw).trim();
  return {intl, pretty, copy: local};
}

const S = {

};
if (!['appels','bilan','gestion'].includes(S.tab)) S.tab='appels';

const workerById = id => S.workers.find(w=>w.id===id);
const benefsOf = wid => S.benefs.filter(b=>(b.workerId||'')===wid);
const statusOf = bid => (S.calls[bid] && S.calls[bid].status) || '';
const byOrder = (a,b) => (a.order??1e15)-(b.order??1e15) || String(a.name).localeCompare(String(b.name),'fr');
const wColor = id => { const i = S.workers.findIndex(w=>w.id===id); return AVC[(i<0?0:i) % AVC.length]; };
const avatar = (w, cls='av') => `<span class="${cls}" style="--c:${wColor(w.id)}" aria-hidden="true">${esc((w.name||'?').trim().charAt(0).toUpperCase())}</span>`;

// Nombre de personnes : individuel (I) = 1, famille (F) = 2
const weight = b => String(b.tc||'').trim().toUpperCase()==='F' ? 2 : 1;
const personsCalled = list => list.filter(b=>statusOf(b.id)).reduce((n,b)=>n+weight(b),0);
const personsComing = list => list.filter(b=>statusOf(b.id)==='vient').reduce((n,b)=>n+weight(b),0);

function deadlineText(){ const j=+S.config.jourLimite; if(!j) return ''; const [y,m]=S.month.split('-').map(Number); return new Date(y,m-1,j).toLocaleDateString('fr-FR',{day:'numeric',month:'long'}); }
function relanceMsg(w){
  const left = benefsOf(w.id).filter(b=>!statusOf(b.id)).sort(byOrder);
  const n = left.length, dl = deadlineText();
  return `Bonjour ${prenomOf(w)},\nPetit rappel Sarepta : il te reste ${n} appel${n>1?'s':''} pour ${monthOnly(S.month)} :\n`+left.map(b=>'- '+b.name).join('\n')+(dl?`\nÀ faire avant le ${dl}.`:'')+`\nMerci de remplir l'app${S.config.lien?' : '+S.config.lien:'.'}\nMerci !`;
}
function relanceAllMsg(){
  const rows = [...S.workers].sort(byOrder).map(w=>{ const left=benefsOf(w.id).filter(b=>!statusOf(b.id)); return left.length?`- ${prenomOf(w)} : ${left.length} (${left.map(b=>b.name).join(', ')})`:''; }).filter(Boolean);
  const dl = deadlineText();
  return `*Rappel Sarepta – appels de ${monthOnly(S.month)}*\nIl reste des appels à faire :\n`+rows.join('\n')+(dl?`\nÀ faire avant le ${dl}.`:'')+`\nMerci de remplir l'app${S.config.lien?' : '+S.config.lien:'.'}`;
}
const relKey = id => 'sarepta.relance.'+S.month+'.'+id;
function counts(list){
  const c={total:list.length, vient:0, pas_repondu:0, vient_pas:0, idle:0};
  list.forEach(b=>{ const s=statusOf(b.id); if (s && c[s]!==undefined) c[s]++; else c.idle++; });
  c.done = c.total - c.idle;
  return c;
}
function trackHTML(c, cls='track'){
  if (!c.total) return `<div class="${cls}"></div>`;
  const w = n => (n/c.total*100).toFixed(2)+'%';
  return `<div class="${cls}" role="img" aria-label="${c.done} sur ${c.total} appelés"><i class="ok" style="width:${w(c.vient)}"></i><i class="warn" style="width:${w(c.pas_repondu)}"></i><i class="no" style="width:${w(c.vient_pas)}"></i></div>`;
}
function legendHTML(c){
  return `<div class="legend"><span><i class="dot ok"></i>${c.vient} viendront</span><span><i class="dot warn"></i>${c.pas_repondu} pas répondu</span><span><i class="dot no"></i>${c.vient_pas} ne viendront pas</span><span><i class="dot idle"></i>${c.idle} à appeler</span></div>`;
}

let toastT;

function setSync(state){

const main = document.getElementById('main');
function render(force){
  const ae = document.activeElement;
  if (!force && ae && main.contains(ae) && /^(TEXTAREA|INPUT|SELECT)$/.test(ae.tagName)) { S.deferred=true; return; }
  S.deferred=false;
  document.getElementById('mLabel').textContent = monthName(S.month);
  document.getElementById('tabs').hidden = S.needCode;
  document.querySelector('.month').style.visibility = S.needCode ? 'hidden' : '';
  document.getElementById('sync').style.visibility = S.needCode ? 'hidden' : '';
  if (S.tab==='bilan' && !S.admin) S.tab='appels';
  document.querySelector('nav.tabs [data-tab="bilan"]').hidden = !S.admin;
  document.querySelectorAll('nav.tabs button').forEach(b=>{ if (b.dataset.tab===S.tab) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current'); });
  if (S.needCode){ S.panel=false; main.innerHTML = codeView(); return; }
  if (S.panel) return;
  let html = '';
  if (S.err) html += `<div class="note err">${esc(S.err)}${S.got.w?'':' <button class="link" data-retry>Réessayer</button>'}</div>`;
  if (S.slow && !S.got.w && !S.err) html += `<div class="note">Connexion lente : les listes arrivent dès que possible.</div>`;
  if (S.tab==='appels') html += viewAppels();
  else if (S.tab==='bilan') html += viewBilan();
  else { html += viewGestion(); if (S.admin) html += `<button class="link" data-lock style="align-self:center;color:var(--muted)">Quitter le mode responsable</button>`; 
  html += `<p class="hint" style="text-align:center;margin:8px 0 0;font-size:.75rem">Version de l'app : ${APP_VERSION} · interface U</p>`; }
  main.innerHTML = html;
  main.querySelectorAll('textarea[data-comment]').forEach(autoGrow);
}

function codeView(){
  return `<div class="gate">
    <div class="hero"><div class="jarbig" role="img" aria-label="Jarre de Sarepta"></div><img class="wm" src="${WORDMARK}" alt="Sacerdoce royal Sarepta"></div>

      <label for="codeInput" class="hint">Entre le code donné par le responsable. Il n'est demandé qu'une fois sur ce téléphone.</label>
      <input type="text" id="codeInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Code d'accès">
      ${S.badCode?'<div class="note err">Ce code n\'est pas le bon. Vérifie-le auprès du responsable.</div>':''}
      <button class="btn primary block">Entrer</button>
    </form></div>`;
}

function viewAppels(){
  if (!S.got.w) return S.err ? '' : `<div class="skel"></div><div class="skel"></div>`;
  if (!S.workers.length) return `<div class="empty"><b>Aucun ouvrier pour l'instant.</b><span>Ajoute les ouvriers et leurs bénéficiaires dans l'onglet Gestion.</span><button class="btn primary" data-go="gestion">Aller à Gestion</button></div>`;
  const me = S.me==='all' ? 'all' : workerById(S.me) ? S.me : null;
  if (!me) return viewPicker();
  if (me==='all') return viewAll();
  const w = workerById(me); const list = benefsOf(me).sort(byOrder); const c = counts(list);
  let out = `<section class="me"><div class="me-top">${avatar(w,'av lg')}<div class="tx"><div class="eyebrow">Mes appels · ${esc(monthOnly(S.month))}</div><b>${esc(nice(w.name))}</b></div><button class="link" data-me="">Changer</button></div>
    <div class="row"><span class="frac" style="color:var(--ink)">${c.done}/${c.total} appelés</span></div>${trackHTML(c)}</section>`;
  if (c.idle && deadlineText() && S.month===nowMonth()) out += `<div class="note" style="border-left:4px solid var(--wheat)">Il te reste <b>${c.idle} appel${c.idle>1?'s':''}</b> à faire avant le <b>${esc(deadlineText())}</b>.</div>`;
  if (c.total && !c.idle) out += `<div class="bravo">${ico('i-check')}<span>Bravo ! Tous tes appels de ${esc(monthOnly(S.month))} sont faits.</span></div>`;
  if (!list.length) return out + `<div class="empty">Aucun bénéficiaire ne t'est encore assigné.</div>`;
  out += filterChips(list);
  const shown = applyFilter(list);
  out += shown.length ? shown.map(cardHTML).join('') : `<div class="empty">Personne dans ce filtre.</div>`;
  return out;
}
function filterChips(list){
  const c = counts(list);
  const f = [['tous','Tous',c.total],['idle','À appeler',c.idle],['pas_repondu','À rappeler',c.pas_repondu],['faits','Faits',c.vient+c.vient_pas]];
  return `<div class="chips" role="group" aria-label="Filtrer">${f.map(([k,l,n])=>`<button class="chip" data-filter="${k}" aria-pressed="${S.filter===k}">${l}<b>${n}</b></button>`).join('')}</div>`;
}
function applyFilter(list){

  if (f==='faits') return list.filter(b=>['vient','vient_pas'].includes(statusOf(b.id)));
  return list;
}

function cardHTML(b){

  return `<article class="call ${info?info.cls:''}">
    <div class="call-top"><div class="tx"><h4>${esc(b.name)}</h4><div class="meta">${b.tc?`<span class="tc">${esc(b.tc)}</span>`:''}${phone}</div>${b.note?`<div class="pnote">${esc(b.note)}</div>`:''}</div>

function ringHTML(c){
  const R=44, C=2*Math.PI*R; let off=0;
  const seg = (n,col)=>{ if(!n||!c.total) return ''; const len=n/c.total*C; const s=`<circle cx="52" cy="52" r="${R}" fill="none" stroke="${col}" stroke-width="12" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}"/>`; off+=len; return s; };
  const pct = c.total ? Math.round(c.done/c.total*100) : 0;
  return `<div class="ring" role="img" aria-label="${pct} % appelés"><svg viewBox="0 0 104 104"><circle cx="52" cy="52" r="${R}" fill="none" stroke="var(--sunk)" stroke-width="12"/>${seg(c.vient,'var(--ok)')}${seg(c.pas_repondu,'var(--warn)')}${seg(c.vient_pas,'var(--no)')}</svg><b>${pct}%</b></div>`;
}

// Chiffre pondéré (F = 2, I = 1) + détail « (2F et 1I) »
function fi(list){
  const f=list.filter(b=>weight(b)===2).length, n=list.length-f, t=f*2+n;
  const parts=[f?f+'F':'', n?n+'I':''].filter(Boolean);
  return t+(parts.length?' ('+parts.join(' et ')+')':'');
}
function bilanText(){
  const by = k => S.benefs.filter(b=> k==='idle' ? !statusOf(b.id) : statusOf(b.id)===k);

  return [
    `*SAREPTA – Bilan de ${monthName(S.month)}*`,
    `Total attendu : ${fi(vient.concat(S.extra))}`,
    `Viendront après appel : ${fi(vient)}`,

}

/* ---------- Export PNG ---------- */
const EXP = { blob:null, url:null };
const BR = { ink:'#171513', muted:'#6c665f', line:'#e3dfd9', clay:'#b0512c', wheat:'#f3b52f', wheatSoft:'#fdf0cc', sky:'#2ea7df', navy:'#1f3f8e', crimson:'#9c1c33', bg:'#ffffff', zebra:'#f8f6f3', ok:'#2c8a4e', warn:'#c07a08', no:'#b4263d' };
function loadImg(src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>r(i); i.onerror=()=>r(null); i.src=src; }); }
function jarSrc(){ const v=getComputedStyle(document.documentElement).getPropertyValue('--jar'); const m=v.match(/url\(["']?(.*?)["']?\)\s*$/); return m?m[1]:''; }

async function buildPNG(withStatus, onlyW, fullNames){
  try{ await Promise.all(['900 40px Montserrat','800 20px Montserrat','600 16px Montserrat','400 20px "Atkinson Hyperlegible"','700 20px "Atkinson Hyperlegible"'].map(f=>document.fonts.load(f))); }catch(_){}
  const [jar, wm] = await Promise.all([loadImg(jarSrc()), loadImg(WORDMARK)]);
  const ws = [...S.workers].sort(byOrder).filter(w=>!onlyW || w.id===onlyW);
  const groups = ws.map(w=>[w, benefsOf(w.id).sort(byOrder)]).filter(g=>g[1].length);
  if (!onlyW){ const orph=S.benefs.filter(b=>!workerById(b.workerId)).sort(byOrder); if(orph.length) groups.push([{id:'',name:'Sans serviteur'},orph]); }
  const W=1080, P=48, RH=46, GAP=12, HEADH=52;
  const cols = withStatus ? [['SERVITEUR ROYAL',fullNames?280:230],['BÉNÉFICIAIRE',fullNames?290:340],['NUMÉRO',180],['TC',56],['STATUT',178]] : [['SERVITEUR ROYAL',fullNames?310:250],['BÉNÉFICIAIRE',fullNames?360:420],['NUMÉRO',240],['TC',74]];
  const nRows = groups.reduce((n,g)=>n+g[1].length,0);
  // Noms complets des serviteurs : retour à la ligne dans leur case
  // Noms jamais coupés : retour à la ligne (2 lignes visées, police réduite si besoin)
  const mc = document.createElement('canvas').getContext('2d');
  const wrapL = (ctx, text, max) => { const out=[]; let cur=''; String(text).split(' ').forEach(wd=>{ const t=cur?cur+' '+wd:wd; if(!cur || ctx.measureText(t).width<=max) cur=t; else { out.push(cur); cur=wd; } }); if(cur) out.push(cur); return out; };
  const fitLines = (text, max, sizes, fam) => { for (const sz of sizes){ mc.font = fam(sz); const l = wrapL(mc, text, max); if (l.length<=2 || sz===sizes[sizes.length-1]) return { lines:l, size:sz, lh: Math.round(sz*1.25) }; } };
  const famW = sz => `800 ${sz}px Montserrat, Arial`, famB = sz => `700 ${sz}px "Atkinson Hyperlegible", Arial`;
  const ginfo = groups.map(([w,list])=>{
    const label = w.id ? (fullNames ? nice(w.name) : prenomOf(w)) : w.name;
    const wl = fitLines(label, cols[0][1]-30, [19,17,16,15,14], famW);

    const rowsH = rows.reduce((a,r)=>a+r.h,0);

  });
  const topH = 250, tableH = HEADH + ginfo.reduce((a,g)=>a+g.gh,0) + Math.max(0,groups.length-1)*GAP, footH = withStatus ? 150 : 104;
  const H = topH + tableH + footH;

  x.fillStyle=BR.bg; x.fillRect(0,0,W,H);

  const tx = P+170;

  F(900,34); x.fillStyle=BR.clay; x.fillText('LISTE D\'APPEL · '+monthName(S.month).toUpperCase(), tx, 198);

  // Tableau
  let y = topH; const tw = cols.reduce((a,c)=>a+c[1],0); const x0 = (W-tw)/2;

  F(800,14); x.fillStyle='#fff'; x.letterSpacing='2px';
  let cx=x0; cols.forEach(([l,w],i)=>{ x.textAlign = i===0||i===3 ? 'center':'left'; x.fillText(l, i===0||i===3 ? cx+w/2 : cx+16, y+HEADH/2+5); cx+=w; });
  x.letterSpacing='0px'; x.textAlign='left';
  y += HEADH;
  const counts0={vient:0,pas_repondu:0,vient_pas:0,idle:0};
  groups.forEach(([w,list],gi)=>{
    if (gi) { y += GAP; }
    const gi_ = ginfo[gi], gh = gi_.gh, wl = gi_.wl;
    // cellule serviteur
    x.fillStyle=BR.wheatSoft; x.fillRect(x0,y,cols[0][1],gh);
    x.fillStyle=BR.wheat; x.fillRect(x0,y,5,gh);
    x.fillStyle='#fff'; x.fillRect(x0+cols[0][1], y, tw-cols[0][1], gh);
    x.font = famW(wl.size); x.fillStyle=BR.ink; x.textAlign='center';
    wl.lines.forEach((ln,li)=> x.fillText(ln, x0+cols[0][1]/2+2, y + gh/2 - wl.lines.length*wl.lh/2 + li*wl.lh + (wl.lh-wl.size)/2 + wl.size*0.85));
    x.textAlign='left';
    let ry = y;
    list.forEach((b,ri)=>{
      const R = gi_.rows[ri], RHh = R.h; let cx = x0+cols[0][1];
      x.fillStyle = ri%2 ? BR.zebra : '#fff'; x.fillRect(cx,ry,tw-cols[0][1],RHh);
      x.font = famB(R.size); x.fillStyle=BR.ink;
      R.lines.forEach((ln,li)=> x.fillText(ln, cx+16, ry + RHh/2 - R.lines.length*R.lh/2 + li*R.lh + (R.lh-R.size)/2 + R.size*0.85));
      cx+=cols[1][1];
      const RH = RHh;
      const t=telInfo(b.phone); F(400,19,'b'); x.fillStyle = t ? BR.ink : BR.muted; x.fillText(fit(t?t.pretty:(b.phone||'—'),cols[2][1]-24), cx+16, ry+RH/2+7); cx+=cols[2][1];
      F(800,16); x.fillStyle=BR.muted; x.textAlign='center'; x.fillText(b.tc||'', cx+cols[3][1]/2, ry+RH/2+6); x.textAlign='left'; cx+=cols[3][1];
      const st=statusOf(b.id); counts0[st||'idle']++;
      if (withStatus){
        const info=STATUS[st]; const col = info ? BR[info.cls] : BR.muted; const label = info ? info.label : 'À appeler';

        x.fillStyle = info ? col : '#efece8'; x.globalAlpha = info ? .14 : 1; x.beginPath(); x.roundRect ? x.roundRect(cx+12,ry+RH/2-13,pw,26,13) : x.rect(cx+12,ry+RH/2-13,pw,26); x.fill(); x.globalAlpha=1;
        x.fillStyle=col; x.fillText(label, cx+25, ry+RH/2+5);

  const tot = nRows, nW = groups.filter(g=>g[0].id).length;

const chains = {};
function write(key, fn){ // une écriture à la fois par élément
  chains[key] = (chains[key]||Promise.resolve()).catch(()=>{}).then(fn).catch(e=>{
    if (e && e.code==='code'){ S.needCode=true; S.badCode=true; render(true); }
    else if (e && e.code==='admin'){ lockAdmin(); closeSheet(); toast('Code responsable requis'); render(true); }
    else { setSync('error'); toast(e && e.code==='version' ? 'Mise à jour incomplète : voir le message en haut' : e && e.message ? 'Pas enregistré : '+e.message : "Pas enregistré : vérifie ta connexion et réessaie."); }
    throw e;
  });
  return chains[key];
}
function saveCall(bid, patch){
  const b = S.benefs.find(x=>x.id===bid); if(!b) return Promise.reject();
  const cur = S.calls[bid] || {};
  const body = {benefId:bid, status:cur.status||'', comment:cur.comment||'', ...patch, updatedAt:Date.now()};
  S.calls[bid] = body;
  return write('c'+bid, ()=>api('setCall', bid, body.status, body.comment));
}
const cmTimers = {};
function flashSaved(bid){ S.saved[bid]=1; render(); setTimeout(()=>{ S.saved[bid]=0; render(); },1800); }
function queueComment(bid, val, now){
  clearTimeout(cmTimers[bid]);
  const go = ()=>{ if ((S.calls[bid]||{}).comment === val) return; saveCall(bid,{comment:val}).then(()=>flashSaved(bid)).catch(()=>{}); };
  if (now) go(); else cmTimers[bid]=setTimeout(go,1200);
}
async function importText(txt){

    .filter(c=>!(/^(serviteur|ouvrier)/i.test(c[0]) && /benef/i.test(c[1]||'')));
  const r = await write('import', ()=>adminApi('importRows', rows));
  return r.result;
}

const sleep = ms => new Promise(r=>setTimeout(r,ms));
const isNet = m => /NetworkError|HTTP 0|Failed to fetch|network|timeout|délai/i.test(m||'');
function apply(d){
  if (S.pending>0) return; // ne pas écraser une modification en cours
  S.workers=d.workers; // « Sans appel » = bénéficiaires sans ouvrier : ils ne sont pas appelés mais comptent dans les personnes attendues
  { const hasW = b => d.workers.some(w=>w.id===b.workerId); S.benefs=d.benefs.filter(hasW); S.extra=d.benefs.filter(b=>!hasW(b)); } S.config=d.config||{}; if(!S.config.lien) S.config.lien=location.origin+'/';

  S.got.w=true; render();
}
function rpc(name, args){ // un appel brut au serveur
  return fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fn:'appels',args:[name, S.code, S.month, ...args]})})
    .then(r=>r.json().then(j=>({ok:r.ok,j})).catch(()=>({ok:false,j:{}})),e=>{ throw {code:'network', message:String(e&&e.message||e)}; })
    .then(({ok,j})=>{ if(ok && j.ok) return j.result; throw {code:'script', message:j.error||'Erreur du serveur.'}; });
}
function call1(name, args){ return rpc(name, args); }
// Écritures : jusqu'à 4 essais si le réseau coupe ou si le serveur est occupé.
async function api(name, ...args){
  S.pending++; setSync('saving');
  try{
    for (let attempt=0; ; attempt++){
      let r;
      try{ r = await call1(name, args); }
      catch(e){
        if (e.code==='network' && attempt<3){ await sleep([1500,4000,9000][attempt]); continue; }
        if (e.code==='script' && /not found|introuvable|is not a function|n'existe pas/i.test(e.message)){ S.err=VERSION_MSG; render(true); }
        throw e;
      }
      if (r && r.error==='busy' && attempt<3){ await sleep([1500,3000,6000][attempt]+Math.random()*1000); continue; }
      if (r && r.version!==APP_VERSION){ S.err=VERSION_MSG; render(true); throw {code:'version'}; }
      if (r && r.error){ if (r.error==='server' && r.message){ S.err=r.message; render(true); } throw {code:r.error, message:r.message}; }
      S.pending--; if(!S.pending) setSync(''); S.epoch++;
      if (S.err && !S.err.startsWith('Code.gs')) S.err='';
      if (r && r.data) apply(r.data);
      return r;
    }
  } catch(e){ S.pending--; setSync(S.pending?'saving':'error'); throw e; }
}
function adminApi(name, ...args){ return api(name, S.admin, ...args); }
function lockAdmin(){ S.admin=''; lsSet('c26-appelsresp',null); }

// Lecture : réessaie toute seule, n'affiche un message que si rien ne s'est chargé.
let lastLoad=0, fails=0, retryT=null;
function load(){
  if (S.loading || S.needCode) return;
  S.loading=true; clearTimeout(retryT);
  const ep = S.epoch; // si une modification arrive pendant la lecture, cette lecture est périmée
  rpc('getData', []).then(r=>{ S.loading=false; S.slow=false; lastLoad=Date.now();
      if (ep!==S.epoch || S.pending){ return; }
      if (r && r.error==='code'){ S.needCode=true; S.badCode=!!S.code; render(true); return; }
      if (r && r.error){ fails++; S.err='Problème côté serveur : '+(r.message||r.error); setSync('error'); render(true); retryT=setTimeout(load, 15000); return; }
      if (!r || !r.data){ S.err="Le serveur n'a rien renvoyé. Rechargez la page dans un instant."; setSync('error'); render(true); return; }
      fails=0; S.err = r.version===APP_VERSION ? '' : VERSION_MSG; if(!S.pending) setSync(''); apply(r.data); render(true); }, e=>{ S.loading=false; fails++; setSync('error');
      const m=String(e&&e.message||e);
      if (!isNet(m)) S.err='Erreur du script : '+m;
      else if (!S.got.w && fails>=2) S.err="Connexion au serveur impossible pour le moment. Nouvel essai automatique… Vérifie ta connexion internet.";
      render(true);
      retryT=setTimeout(load, Math.min(30000, 2500*Math.pow(2,fails-1))); });
}

render();
main.setAttribute('data-ok','1');
load();
setTimeout(()=>{ if(!S.got.w && !S.needCode){ S.slow=true; render(); } },10000);
// Rafraîchissement doux : toutes les ~45 s quand l'app est à l'écran
setInterval(()=>{ if (document.visibilityState==='visible' && !S.panel && !S.pending && Date.now()-lastLoad>20000) load(); }, 45000+Math.floor(Math.random()*10000));
document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible' && Date.now()-lastLoad>10000) load(); });
})();
</script>
